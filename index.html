      /* ---------- DYNAMIC CUSTOM PAGE SYSTEM (DRIVE HTML -> SANDBOXED IFRAME) ---------- */
      function buildCustomSrcdoc(rawHtml, slug) {
        const resizer = `<script>(function(){function s(){var h=Math.max(document.documentElement?document.documentElement.scrollHeight:0,document.body?document.body.scrollHeight:0);if(h>0&&window.parent)window.parent.postMessage({type:'thimble-page-height',slug:${JSON.stringify(slug)},height:h},'*');}window.addEventListener('load',s);if(typeof ResizeObserver!=='undefined'){new ResizeObserver(s).observe(document.documentElement);}setTimeout(s,150);})();<\/script>`;
        if (/<\/body>/i.test(rawHtml)) return rawHtml.replace(/<\/body>/i, resizer + '</body>');
        return rawHtml + resizer;
      }

      async function ensureCustomPageLoaded(slug) {
        const cleanSlug = slugify(slug);
        if (!cleanSlug) {
          state.activePageSlug = '';
          state.activePageStatus = 'error';
          state.activePageError = 'Page not found.';
          render();
          return;
        }
        // Check active directory first when loaded
        const listed = (state.customPages || []).find((p) => p.slug === cleanSlug);
        if (state.status === 'ready' && state.customPages.length && !listed) {
          // Still verify with backend only if page directory wasn't populated; if directory says not active, 404 immediately.
        }
        if (pageCache.has(cleanSlug)) {
          state.activePageSlug = cleanSlug;
          state.activePageStatus = 'ready';
          state.activePageData = pageCache.get(cleanSlug);
          state.activePageError = '';
          render();
          return;
        }
        state.activePageSlug = cleanSlug;
        state.activePageStatus = 'loading';
        state.activePageData = null;
        state.activePageError = '';
        render();

        try {
          const page = await fetchCustomPage(apiUrl, cleanSlug, { fetchImpl });
          pageCache.set(cleanSlug, page);
          if (state.activePageSlug === cleanSlug) {
            state.activePageStatus = 'ready';
            state.activePageData = page;
            if (page.title) document.title = `${page.title} — ${state.settings.store_name || 'Store'}`;
            render();
          }
        } catch (err) {
          if (state.activePageSlug === cleanSlug) {
            state.activePageStatus = 'error';
            state.activePageError = err.message || 'Page not found.';
            render();
          }
        }
      }

      function viewCustomPage(slug) {
        if (state.activePageStatus === 'loading' || state.activePageSlug !== slugify(slug)) {
          return `<p class="muted" role="status">Loading page…</p>`;
        }
        if (state.activePageStatus === 'error' || !state.activePageData) {
          return renderNotFound('page');
        }
        const p = state.activePageData;
        return `<div class="custom-page-shell">
          ${renderPageHeader({ breadcrumb: `<a href="#/">← Home</a>`, title: p.title || slug, subtitle: p.meta_description || '' })}
          <div class="custom-page-frame-wrap">
            <iframe class="custom-page-frame" id="custom-page-frame" title="${esc(p.title || slug)}" sandbox="allow-scripts allow-forms allow-popups allow-popups-to-escape-sandbox"></iframe>
          </div>
        </div>`;
      }

      /* ---------- ROUTER & SHELL RENDER ---------- */
      function renderShell(routeInfo) {
        const s = state.settings;
        const name = s.store_name || 'Store';
        const logo = imageUrl(s.logo_url, 100);
        const navLinks = getVisibleNavLinks();
        const wa = s.whatsapp_number;
        const hasWa = isValidWaNumber(wa);
        const phoneHref = telHref(s.contact_phone);
        const email = String(s.contact_email || '').trim();
        const instagram = httpsUrl(s.instagram_url);
        const count = cartCount(state.lines);
        const contactLinks = [
          hasWa && { label: 'Chat on WhatsApp', href: 'https://wa.me/' + wa, external: true },
          phoneHref && s.contact_phone && { label: s.contact_phone, href: phoneHref },
          email && { label: email, href: 'mailto:' + email },
          instagram && { label: 'Instagram', href: instagram, external: true }
        ].filter(Boolean);

        let mainContent = '';
        if (state.status === 'loading') {
          mainContent = `<p class="muted" role="status">Loading…</p>`;
        } else if (state.status === 'error') {
          mainContent = renderEmptyState('Couldn’t load the store', state.error, `<button type="button" class="btn" id="store-retry-btn">Try again</button>`);
        } else {
          const { path, params } = routeInfo;
          if (path === '/') mainContent = viewHome();
          else if (path === '/shop') mainContent = CONFIG.MODULES.shop ? viewListing({ products: state.products, title: 'Shop', eyebrow: 'Catalogue' }, params) : renderNotFound('page');
          else if (path === '/new-arrivals') mainContent = CONFIG.MODULES.newArrivals ? viewNewArrivals() : renderNotFound('page');
          else if (path === '/categories') mainContent = CONFIG.MODULES.categories ? viewCategories() : renderNotFound('page');
          else if (path.startsWith('/category/')) mainContent = CONFIG.MODULES.categories ? viewCategoryDetail(decodeURIComponent(path.slice(10)), params) : renderNotFound('page');
          else if (path === '/best-sellers') mainContent = CONFIG.MODULES.bestSellers ? viewBestSellers() : renderNotFound('page');
          else if (path.startsWith('/product/')) mainContent = viewProduct(decodeURIComponent(path.slice(9)));
          else if (path === '/about') mainContent = viewAbout();
          else if (path === '/contact') mainContent = viewContact();
          else if (path === '/cart') mainContent = viewCart();
          else if (path === '/checkout') {
            mainContent = viewCheckout();
            if (mainContent === '__REDIRECT_CART__') { navigate('/cart', { replace: true }); return; }
          } else if (path === '/done') {
            mainContent = viewDone();
            if (mainContent === '__REDIRECT_HOME__') { navigate('/', { replace: true }); return; }
          } else if (path.startsWith('/page/')) {
            mainContent = viewCustomPage(decodeURIComponent(path.slice(6)));
          } else {
            // Also match direct custom slug e.g. #/lookbook if active in customPages
            const maybeSlug = path.slice(1);
            const matchedCustom = (state.customPages || []).find((p) => p.slug === maybeSlug);
            mainContent = matchedCustom ? viewCustomPage(matchedCustom.slug) : renderNotFound('page');
          }
        }

        const activePath = routeInfo.path;
        const navHtml = navLinks.map((l) => {
          const isActive = l.to === '/' ? activePath === '/' : activePath === l.to || activePath.startsWith(l.to + '/');
          return `<a href="#${esc(l.to)}"${isActive ? ' class="active" aria-current="page"' : ''}>${esc(l.label)}</a>`;
        }).join('');

        rootEl.innerHTML = `
          <a class="skip" href="#main" id="skip-link">Skip to content</a>
          ${s.banner_text ? `<div class="announce">${esc(s.banner_text)}</div>` : ''}
          ${state.offlineMode ? `<div class="offline-banner" role="status">Showing saved storefront snapshot while the backend is temporarily unreachable. <button type="button" id="offline-retry-btn">Retry connection</button></div>` : ''}
          <header class="site-header">
            <div class="container header-row">
              <a href="#/" class="brand">
                ${logo ? `<img src="${esc(logo)}" alt="" width="34" height="34" />` : `<span class="brand-mark" aria-hidden="true">${esc(name.slice(0, 1))}</span>`}
                <span>${esc(name)}</span>
              </a>
              <button type="button" class="icon-btn menu-btn" id="menu-btn" aria-expanded="${state.navOpen}" aria-controls="primary-nav">${state.navOpen ? 'Close' : 'Menu'}</button>
              <nav id="primary-nav" class="primary-nav${state.navOpen ? ' open' : ''}" aria-label="Primary">${navHtml}</nav>
              ${CONFIG.MODULES.search && CONFIG.MODULES.shop ? `<form class="header-search" id="header-search-form" role="search">
                <label class="sr-only" for="header-q">Search products</label>
                <input id="header-q" type="search" placeholder="Search products" />
              </form>` : ''}
              <a href="#/cart" class="icon-btn cart-link" aria-label="${esc(`Cart, ${count} ${count === 1 ? 'item' : 'items'}`)}">🛒<span class="count" aria-hidden="true">${count}</span></a>
            </div>
          </header>
          <main id="main" class="container page" tabindex="-1">${mainContent}</main>
          <footer class="site-footer">
            <div class="container footer-grid">
              <div class="footer-brand">
                <a href="#/" class="brand footer-brand-link">
                  ${logo ? `<img src="${esc(logo)}" alt="" width="34" height="34" />` : `<span class="brand-mark" aria-hidden="true">${esc(name.slice(0, 1))}</span>`}
                  <span>${esc(name)}</span>
                </a>
                ${CONFIG.FOOTER_NOTE ? `<p class="footer-note">${esc(CONFIG.FOOTER_NOTE)}</p>` : ''}
              </div>
              <nav class="footer-col" aria-label="Footer">
                <p class="eyebrow footer-col-title">Navigation</p>
                <div class="footer-links">${navLinks.map((l) => `<a href="#${esc(l.to)}">${esc(l.label)}</a>`).join('')}</div>
              </nav>
              ${contactLinks.length ? `<div class="footer-col">
                <p class="eyebrow footer-col-title">Contact</p>
                <div class="footer-links">${contactLinks.map((c) => c.external
                  ? `<a href="${esc(c.href)}" target="_blank" rel="noopener noreferrer">${esc(c.label)}</a>`
                  : `<a href="${esc(c.href)}">${esc(c.label)}</a>`).join('')}
                </div>
              </div>` : ''}
            </div>
            <div class="container footer-bottom">
              <p class="footer-copy">© ${new Date().getFullYear()} ${esc(name)}</p>
            </div>
          </footer>
          ${hasWa ? `<a class="wa-fab" href="${esc('https://wa.me/' + wa)}" target="_blank" rel="noopener noreferrer" aria-label="Chat on WhatsApp">💬</a>` : ''}
        `;

        // Attach srcdoc cleanly onto custom page iframe
        const frame = rootEl.querySelector('#custom-page-frame');
        if (frame && state.activePageData && state.activePageData.html) {
          frame.srcdoc = buildCustomSrcdoc(state.activePageData.html, state.activePageData.slug);
        }

        bindRenderedEvents(routeInfo);
      }

      function bindRenderedEvents(routeInfo) {
        const skip = rootEl.querySelector('#skip-link');
        if (skip) skip.onclick = (e) => {
          e.preventDefault();
          const main = rootEl.querySelector('#main');
          if (main) { main.focus(); if (main.scrollIntoView) main.scrollIntoView(); }
        };

        const menuBtn = rootEl.querySelector('#menu-btn');
        if (menuBtn) menuBtn.onclick = () => { state.navOpen = !state.navOpen; render(); };

        const retryBtn = rootEl.querySelector('#store-retry-btn') || rootEl.querySelector('#offline-retry-btn');
        if (retryBtn) retryBtn.onclick = () => loadStorefront();

        const headerForm = rootEl.querySelector('#header-search-form');
        if (headerForm) headerForm.onsubmit = (e) => {
          e.preventDefault();
          const val = (rootEl.querySelector('#header-q')?.value || '').trim();
          navigate('/shop' + (val ? '?q=' + encodeURIComponent(val) : ''));
        };

        // Shop filter events
        const shopQ = rootEl.querySelector('#shop-q');
        const shopCat = rootEl.querySelector('#shop-cat');
        const shopAv = rootEl.querySelector('#shop-av');
        const shopSort = rootEl.querySelector('#shop-sort');
        const updateShopParam = (key, val) => {
          const next = new URLSearchParams(routeInfo.params);
          if (!val || val === 'all' || val === 'All' || val === 'default') next.delete(key);
          else next.set(key, val);
          state.shopVisible = 12;
          const qs = next.toString();
          navigate(routeInfo.path + (qs ? '?' + qs : ''), { replace: true });
          const targetId = key === 'q' ? '#shop-q' : key === 'category' ? '#shop-cat' : key === 'avail' ? '#shop-av' : '#shop-sort';
          const refocused = rootEl.querySelector(targetId);
          if (refocused) {
            refocused.focus();
            if (key === 'q' && refocused.setSelectionRange) {
              const len = refocused.value.length;
              refocused.setSelectionRange(len, len);
            }
          }
        };
        if (shopQ) shopQ.oninput = (e) => updateShopParam('q', e.target.value);
        if (shopCat) shopCat.onchange = (e) => updateShopParam('category', e.target.value);
        if (shopAv) shopAv.onchange = (e) => updateShopParam('avail', e.target.value);
        if (shopSort) shopSort.onchange = (e) => updateShopParam('sort', e.target.value);

        const filterToggle = rootEl.querySelector('#filter-toggle-btn');
        if (filterToggle) filterToggle.onclick = () => { state.shopFiltersOpen = !state.shopFiltersOpen; render(); };

        rootEl.querySelectorAll('[data-reset-filters]').forEach((btn) => {
          btn.onclick = () => { state.shopVisible = 12; navigate(routeInfo.path, { replace: true }); };
        });
        const loadMore = rootEl.querySelector('[data-load-more]');
        if (loadMore) loadMore.onclick = () => { state.shopVisible += 12; render(); };

        // Product page gallery & cart buttons
        rootEl.querySelectorAll('[data-thumb-idx]').forEach((btn) => {
          btn.onclick = () => { state.galleryIndex = Number(btn.dataset.thumbIdx) || 0; render(); };
        });
        rootEl.querySelectorAll('[data-main-img],[data-thumb-img]').forEach((img) => {
          img.onerror = () => {
            const url = img.dataset.mainImg || img.dataset.thumbImg;
            if (url) { state.galleryBroken.add(url); render(); }
          };
        });
        const qtySel = rootEl.querySelector('#qty');
        if (qtySel) qtySel.onchange = (e) => { state.productQty = Number(e.target.value) || 1; };

        const prodAdd = rootEl.querySelector('#product-add-btn');
        if (prodAdd) prodAdd.onclick = () => {
          commitCart(addToCartLines(state.lines, state.products, prodAdd.dataset.id, state.productQty), 'Added to cart ✓');
        };

        rootEl.querySelectorAll('[data-add-cart]').forEach((btn) => {
          btn.onclick = () => commitCart(addToCartLines(state.lines, state.products, btn.dataset.addCart, 1), 'Added to cart ✓');
        });

        rootEl.querySelectorAll('[data-qty-set]').forEach((btn) => {
          btn.onclick = () => commitCart(setCartQuantity(state.lines, state.products, btn.dataset.qtySet, Number(btn.dataset.qty)));
        });

        rootEl.querySelectorAll('[data-remove-line]').forEach((btn) => {
          btn.onclick = () => commitCart({ lines: removeCartLine(state.lines, btn.dataset.removeLine) });
        });

        // Checkout inputs & submission
        const coForm = rootEl.querySelector('#checkout-form');
        if (coForm) {
          ['name', 'phone', 'email', 'address'].forEach((k) => {
            const el = rootEl.querySelector('#co-' + k);
            if (el) el.oninput = (e) => { state.checkoutForm[k] = e.target.value; };
          });
          const nl = rootEl.querySelector('#co-newsletter');
          if (nl) nl.onchange = (e) => { state.checkoutNewsletter = e.target.checked; };
          const hp = rootEl.querySelector('#website');
          if (hp) hp.oninput = (e) => { state.checkoutHoneypot = e.target.value; };

          coForm.onsubmit = async (e) => {
            e.preventDefault();
            if (state.checkoutBusy) return;
            const found = validateCustomer(state.checkoutForm);
            state.checkoutErrors = found;
            state.checkoutFormError = '';
            if (Object.keys(found).length) { render(); return; }

            state.checkoutBusy = true;
            render();
            let tab = null;
            try { tab = window.open('about:blank', '_blank'); } catch {}
            try {
              const details = { customer: state.checkoutForm, newsletter: state.checkoutNewsletter, lines: state.lines };
              const payload = buildOrderPayload({
                ...details,
                requestId: requestIdFor(details, session),
                startedAt: state.checkoutStartedAt,
                honeypot: state.checkoutHoneypot
              });
              const order = await submitOrder(apiUrl, payload, { fetchImpl });
              saveLastOrder(order, session);
              clearRequestId(session);
              state.lines = [];
              cartStore.save([]);
              state.checkoutBusy = false;
              state.checkoutForm = { name: '', phone: '', email: '', address: '' };
              state.checkoutErrors = {};
              if (tab && order.whatsappUrl) tab.location = order.whatsappUrl;
              else if (tab) tab.close();
              navigate('/done');
            } catch (err) {
              if (tab) try { tab.close(); } catch {}
              state.checkoutBusy = false;
              state.checkoutFormError = err.message || 'Something went wrong. Please try again.';
              render();
            }
          };
        }

        const doneKeep = rootEl.querySelector('#done-keep-shopping');
        if (doneKeep) doneKeep.onclick = () => clearLastOrder(session);

        // Contact WhatsApp form
        const contactForm = rootEl.querySelector('#contact-form');
        if (contactForm) {
          const wn = rootEl.querySelector('#msg-name');
          const wb = rootEl.querySelector('#msg-body');
          if (wn) wn.oninput = (e) => { state.contactName = e.target.value; };
          if (wb) wb.oninput = (e) => { state.contactMsg = e.target.value; };
          contactForm.onsubmit = (e) => {
            e.preventDefault();
            if (!state.contactMsg.trim()) { notify('Please type a message.'); return; }
            const wa = state.settings.whatsapp_number;
            const text = `Hello ${state.settings.store_name}! ${state.contactMsg.trim()}${state.contactName.trim() ? '\n\n— ' + state.contactName.trim() : ''}`;
            window.open('https://wa.me/' + wa + '?text=' + encodeURIComponent(text), '_blank', 'noopener');
          };
        }
      }

      function render() {
        renderShell(parseHash());
      }

      function onRouteChange() {
        state.navOpen = false;
        const route = parseHash();
        if (state.status === 'ready') {
          if (route.path.startsWith('/page/')) {
            ensureCustomPageLoaded(decodeURIComponent(route.path.slice(6)));
            return;
          }
          const directCustom = (state.customPages || []).find((p) => p.slug === route.path.slice(1));
          if (directCustom) {
            ensureCustomPageLoaded(directCustom.slug);
            return;
          }
        }
        render();
        if (typeof window !== 'undefined' && window.scrollTo && !options.disableScroll) {
          try { window.scrollTo(0, 0); } catch {}
        }
      }

      async function loadStorefront() {
        if (!apiUrl) {
          state.status = 'error';
          state.error = 'Store API URL is not configured.';
          render();
          return;
        }
        state.status = 'loading';
        state.offlineMode = false;
        state.error = '';
        pageCache.clear();
        render();

        try {
          const data = await fetchStorefront(apiUrl, { fetchImpl });
          state.products = data.products;
          state.settings = data.settings;
          state.bestSellers = data.bestSellers;
          state.hero = data.hero || {};
          state.serverCategories = data.categories || [];
          state.customPages = data.customPages || [];
          state.navigation = data.navigation || [];
          state.lines = normaliseCart(state.lines, state.products);
          cartStore.save(state.lines);
          state.status = 'ready';
          try { storage.setItem(CACHE_KEY, JSON.stringify({ savedAt: Date.now(), data })); } catch {}
          applyBrandTheme();
          onRouteChange();
        } catch (err) {
          let restored = false;
          try {
            const cached = JSON.parse(storage.getItem(CACHE_KEY) || 'null');
            if (cached && cached.data && Array.isArray(cached.data.products)) {
              state.products = normaliseProducts(cached.data.products);
              state.settings = normaliseSettings(cached.data.settings || {});
              state.bestSellers = cached.data.bestSellers || [];
              state.hero = cached.data.hero || {};
              state.serverCategories = cached.data.categories || [];
              state.customPages = cached.data.customPages || [];
              state.navigation = cached.data.navigation || [];
              state.lines = normaliseCart(state.lines, state.products);
              state.status = 'ready';
              state.offlineMode = true;
              restored = true;
              applyBrandTheme();
              onRouteChange();
            }
          } catch {}
          if (!restored) {
            state.status = 'error';
            state.error = err.message || 'The store could not be loaded.';
            render();
          }
        }
      }

      // Safe resize listener for custom HTML page iframes
      function onMessage(event) {
        const frame = rootEl.querySelector('#custom-page-frame');
        if (!frame || !event || event.source !== frame.contentWindow) return;
        const d = event.data;
        if (d && d.type === 'thimble-page-height' && Number.isFinite(Number(d.height))) {
          const h = Math.min(20000, Math.max(360, Math.ceil(Number(d.height)) + 24));
          frame.style.height = h + 'px';
        }
      }

      if (typeof window !== 'undefined' && !options.manualBoot) {
        const migrated = migrateLegacyHash(window.location.hash);
        if (migrated) window.location.replace(window.location.pathname + window.location.search + migrated);
        window.addEventListener('hashchange', onRouteChange);
        window.addEventListener('message', onMessage);
      }

      loadStorefront();
      return { state, navigate, loadStorefront, render, pageCache };
    }

    // Export pure functions for automated testing & boot automatically in browser
    window.__STORE_APP__ = {
      CONFIG,
      mountStore,
      core: {
        httpsUrl, imageUrl, cloudinaryHeroUrl, waDigits, isValidWaNumber, whatsappUrl, telHref, slugify,
        money, percentOff, normaliseProduct, normaliseProducts, isSoldOut, stockLabel, buildCategories,
        filterProducts, sortProducts, hasCreatedAt, newArrivals, featuredProducts, bestSellerProducts,
        relatedProducts, parseStoredCart, normaliseCart, addToCartLines, setCartQuantity, removeCartLine,
        cartCount, detailedLines, cartTotal, createCartStorage, validateCustomer, checkoutFingerprint,
        requestIdFor, clearRequestId, buildOrderPayload, submitOrder, CheckoutError, migrateLegacyHash,
        fetchStorefront, fetchCustomPage, normaliseSettings
      }
    };

    if (typeof window !== 'undefined' && document.getElementById('app') && !window.__THIMBLE_NO_AUTO_MOUNT__) {
      mountStore();
    }
  })();
  </script>
</body>
</html>
