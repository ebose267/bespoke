<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Store</title>
  <meta name="description" content="Shop online and confirm your order easily on WhatsApp." />
  <style>
    :root {
      --bg: #ffffff;
      --surface: #f6f5f2;
      --card: #ffffff;
      --border: #e4e1da;
      --text: #1b1d18;
      --text-muted: #62675c;
      --accent: #0b6e4f;
      --accent-contrast: #ffffff;
      --success: #2f7d32;
      --danger: #c0392b;
      --font-heading: Georgia, "Times New Roman", serif;
      --font-body: system-ui, -apple-system, "Segoe UI", sans-serif;
      --radius-card: 14px;
      --radius-control: 10px;
      --radius-pill: 999px;
      --shadow: 0 6px 24px rgba(0,0,0,.08);
      --page-width: 1180px;
      --gap: clamp(14px, 2vw, 24px);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 400 1rem/1.6 var(--font-body);
      -webkit-font-smoothing: antialiased;
    }
    h1, h2, h3 { font-family: var(--font-heading); line-height: 1.15; margin: 0 0 .5em; }
    h1 { font-size: clamp(1.8rem, 4vw, 2.6rem); }
    h2 { font-size: clamp(1.3rem, 2.5vw, 1.7rem); }
    h3 { font-size: 1.05rem; }
    a { color: inherit; }
    img { max-width: 100%; display: block; }
    p { margin: 0 0 1em; }
    :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

    .container { width: min(100% - 2 * clamp(16px, 5vw, 40px), var(--page-width)); margin-inline: auto; }
    .page { padding-block: clamp(24px, 4vw, 48px); min-height: 60vh; }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    .skip {
      position: absolute; left: -999px; top: 8px;
      background: var(--accent); color: var(--accent-contrast);
      padding: 8px 14px; border-radius: var(--radius-control); z-index: 100;
      text-decoration: none;
    }
    .skip:focus { left: 8px; }
    .muted { color: var(--text-muted); }
    .center { text-align: center; }
    .prewrap { white-space: pre-line; }
    .eyebrow { font-size: .78rem; color: var(--text-muted); letter-spacing: .04em; margin: 0; }
    .announce { background: var(--accent); color: var(--accent-contrast); text-align: center; padding: 7px 16px; font-size: .85rem; }
    .offline-banner {
      background: #fdf3e0;
      color: #6b4506;
      border-bottom: 1px solid #ecd6a5;
      padding: 8px 16px;
      font-size: .86rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .offline-banner button {
      background: #fff;
      border: 1px solid #c9a75c;
      color: #5b3b04;
      border-radius: var(--radius-pill);
      padding: 4px 12px;
      font: 600 .8rem var(--font-body);
      cursor: pointer;
    }

    /* header */
    .site-header {
      position: sticky; top: 0; z-index: 40;
      background: color-mix(in srgb, var(--bg) 90%, transparent);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }
    .header-row { display: flex; align-items: center; gap: 12px; padding-block: 10px; flex-wrap: wrap; }
    .brand {
      display: flex; align-items: center; gap: 10px; text-decoration: none;
      font: 700 1.15rem var(--font-heading); margin-right: auto; min-width: 0;
    }
    .brand span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .brand img, .brand-mark { width: 34px; height: 34px; border-radius: var(--radius-control); object-fit: cover; flex-shrink: 0; }
    .brand-mark { display: grid; place-items: center; background: var(--accent); color: var(--accent-contrast); font-size: 1rem; }
    .primary-nav { display: flex; gap: 4px; order: 5; flex-wrap: wrap; }
    .primary-nav a {
      padding: 7px 14px; border-radius: var(--radius-pill); text-decoration: none;
      font-size: .9rem; color: var(--text-muted);
    }
    .primary-nav a:hover, .primary-nav a.active { background: var(--surface); color: var(--accent); }
    .header-search input { width: 190px; }
    .icon-btn {
      position: relative; min-width: 44px; height: 44px; padding: 0 12px;
      border: 1px solid var(--border); border-radius: var(--radius-pill);
      background: var(--card); color: var(--text);
      display: inline-flex; align-items: center; justify-content: center;
      text-decoration: none; font: inherit; cursor: pointer; flex-shrink: 0;
    }
    .menu-btn { display: none; font-size: .85rem; }
    .count {
      position: absolute; top: -4px; right: -4px; min-width: 20px; height: 20px;
      border-radius: 10px; background: var(--accent); color: var(--accent-contrast);
      font-size: .75rem; font-weight: 600; display: grid; place-items: center; padding: 0 5px;
    }
    @media (max-width: 860px) {
      .menu-btn { display: inline-flex; }
      .primary-nav { display: none; width: 100%; flex-direction: column; }
      .primary-nav.open { display: flex; }
      .primary-nav.open a { min-height: 44px; display: flex; align-items: center; }
      .header-search { order: 6; width: 100%; }
      .header-search input { width: 100%; }
    }
    @media (max-width: 480px) {
      .header-row { gap: 8px; }
      .brand { font-size: 1.05rem; gap: 8px; }
    }

    /* controls */
    input, select, textarea {
      width: 100%; font: inherit; color: var(--text);
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-control); padding: 11px 14px; min-height: 44px;
    }
    textarea { resize: vertical; }
    label { display: block; font-size: .85rem; font-weight: 500; margin: 0 0 5px; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      min-height: 44px; padding: 10px 26px;
      border: 1px solid var(--accent); border-radius: var(--radius-pill);
      background: var(--accent); color: var(--accent-contrast);
      font: 600 .92rem var(--font-body); text-decoration: none; cursor: pointer;
      transition: filter .15s;
    }
    .btn:hover { filter: brightness(1.08); }
    .btn:disabled { opacity: .5; cursor: not-allowed; filter: none; }
    .btn-outline { background: transparent; color: var(--text); border-color: var(--border); }
    .hero-image .btn-outline { color: #fff; border-color: rgba(255,255,255,.55); background: rgba(0,0,0,.22); }
    .btn-whatsapp { background: #1fa855; border-color: #1fa855; color: #fff; }
    .btn-block { width: 100%; }
    .btn-sm { min-height: 44px; padding: 8px 16px; font-size: .86rem; }
    .link-btn {
      background: none; border: 0; padding: 0; color: var(--text-muted);
      text-decoration: underline; font: inherit; font-size: .86rem; cursor: pointer;
    }
    .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; }
    .actions.center { justify-content: center; }
    .field { margin-bottom: 14px; }
    .field-error { color: var(--danger); font-size: .84rem; margin: 5px 0 0; }
    .check { display: flex; gap: 10px; align-items: center; min-height: 44px; font-weight: 400; margin: 6px 0 16px; cursor: pointer; }
    .check input { width: 20px; height: 20px; min-height: 0; margin-top: 0; flex-shrink: 0; accent-color: var(--accent); }
    .alert {
      background: color-mix(in srgb, var(--danger) 8%, var(--card));
      border: 1px solid color-mix(in srgb, var(--danger) 30%, transparent);
      color: var(--danger); border-radius: var(--radius-control);
      padding: 10px 14px; margin-bottom: 14px; font-size: .9rem;
    }
    .hp { position: absolute !important; left: -10000px; width: 1px; height: 1px; overflow: hidden; }

    /* page headers */
    .page-head { margin-bottom: clamp(18px, 3vw, 28px); }
    .breadcrumb {
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
      margin-bottom: 8px; font-size: .88rem; color: var(--text-muted);
    }
    .breadcrumb a { text-decoration: none; display: inline-flex; align-items: center; gap: 6px; min-height: 44px; }
    .breadcrumb a:hover { color: var(--accent); }
    .page-head-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
    .page-head h1 { margin-bottom: 4px; }
    .page-lead { margin: 4px 0 0; max-width: 46ch; }

    /* hero — Cloudinary dynamic image with focal point & per-screen-size fit */
    .hero {
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: clamp(48px, 9vw, 110px) 20px;
      border-radius: var(--radius-card);
      margin-bottom: clamp(28px, 5vw, 56px);
      background: radial-gradient(ellipse at 50% 0, color-mix(in srgb, var(--accent) 16%, transparent), transparent 70%);
      min-height: var(--hero-min-h-desktop, auto);
    }
    .hero-media {
      position: absolute;
      inset: 0;
      z-index: 0;
      background: #141714;
    }
    .hero-media picture,
    .hero-media img {
      width: 100%;
      height: 100%;
      display: block;
    }
    .hero-media img {
      object-fit: var(--hero-fit-desktop, cover);
      object-position: var(--hero-pos, 50% 50%);
    }
    .hero-scrim {
      position: absolute;
      inset: 0;
      z-index: 1;
      background: linear-gradient(
        180deg,
        rgba(0, 0, 0, var(--hero-overlay, 0.45)),
        rgba(0, 0, 0, calc(var(--hero-overlay, 0.45) + 0.1))
      );
    }
    .hero-content { position: relative; z-index: 2; max-width: 42rem; width: 100%; }
    .hero-image { color: #ffffff; background: #141714; }
    .hero .eyebrow { color: var(--accent); margin-bottom: 8px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; }
    .hero-image .eyebrow, .hero-image .lead { color: rgba(255, 255, 255, .92); }
    .hero h1 { font-size: clamp(2.2rem, 7vw, 4.2rem); margin-bottom: .35em; }
    .lead { max-width: 34rem; margin: 0 auto 1.2em; color: var(--text-muted); font-size: 1.1rem; }
    .hero .actions { justify-content: center; }
    @media (max-width: 960px) {
      .hero { min-height: var(--hero-min-h-tablet, auto); }
      .hero-media img { object-fit: var(--hero-fit-tablet, var(--hero-fit-desktop, cover)); }
    }
    @media (max-width: 600px) {
      .hero { min-height: var(--hero-min-h-mobile, auto); padding: clamp(40px, 8vw, 76px) 16px; }
      .hero-media img { object-fit: var(--hero-fit-mobile, var(--hero-fit-desktop, cover)); }
    }

    .trust {
      list-style: none; padding: 0; margin: 0 0 clamp(28px, 5vw, 56px);
      display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: var(--gap);
    }
    .trust li {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius-card); padding: 16px; text-align: center;
      font-size: .88rem; color: var(--text-muted);
    }
    .trust strong { display: block; color: var(--text); }
    section { margin-bottom: clamp(28px, 5vw, 56px); }
    .section-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 16px; }

    /* cards + grids */
    .grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--gap); }
    @media (max-width: 1119px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
    @media (max-width: 859px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; } }
    @media (max-width: 339px) { .grid { grid-template-columns: minmax(0, 1fr); } }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-card); overflow: hidden; }
    .pad { padding: 22px; }
    .product-card { display: flex; flex-direction: column; min-width: 0; transition: transform .2s, box-shadow .2s; }
    .product-card:hover { transform: translateY(-3px); box-shadow: var(--shadow); }
    .product-media {
      position: relative; display: grid; place-items: center; aspect-ratio: 1;
      background: var(--surface); text-decoration: none; overflow: hidden;
    }
    .product-media img { width: 100%; height: 100%; object-fit: cover; }
    .placeholder { font-size: 2.4rem; }
    .product-body { display: flex; flex-direction: column; gap: 6px; padding: 14px 16px 16px; flex: 1; min-width: 0; }
    .product-meta { display: flex; align-items: center; justify-content: space-between; gap: 6px; flex-wrap: wrap; }
    .product-body h3 { margin: 0; font-size: 1rem; line-height: 1.25; overflow-wrap: anywhere; }
    .product-body h3 a { text-decoration: none; }
    .product-body h3 a:hover { color: var(--accent); }
    .product-body .btn { margin-top: 8px; padding-inline: 12px; }
    .price { display: inline-flex; align-items: baseline; gap: 6px 8px; flex-wrap: wrap; font-weight: 600; color: var(--accent); margin-top: auto; padding-top: 4px; }
    .price-lg { font-size: 1.7rem; }
    .price-was { color: var(--text-muted); font-weight: 400; font-size: .86rem; }
    .badge { position: absolute; top: 10px; left: 10px; padding: 3px 10px; border-radius: var(--radius-pill); font-size: .75rem; font-weight: 600; background: var(--danger); color: #fff; }
    .price .badge { position: static; }
    .badge-sale { background: var(--accent); color: var(--accent-contrast); }
    .stock { font-size: .76rem; font-weight: 600; line-height: 1.2; }
    .stock-in { color: var(--success); }
    .stock-few { color: var(--accent); }
    .stock-out { color: var(--danger); }
    @media (max-width: 480px) {
      .product-body { padding: 11px 12px 12px; gap: 5px; }
      .product-body h3 { font-size: .92rem; }
      .product-body .btn { font-size: .82rem; padding: 8px 10px; min-height: 44px; }
      .price { font-size: .94rem; }
      .price-was { font-size: .78rem; }
    }

    /* category tiles */
    .tiles { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: var(--gap); }
    .tiles-discovery { grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
    @media (max-width: 560px) { .tiles, .tiles-discovery { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; } }
    @media (max-width: 339px) { .tiles, .tiles-discovery { grid-template-columns: minmax(0, 1fr); } }
    .tile {
      position: relative; display: grid; aspect-ratio: 4/3; border-radius: var(--radius-card);
      overflow: hidden; background: var(--surface); border: 1px solid var(--border);
      text-decoration: none; place-items: center; transition: transform .2s, box-shadow .2s;
    }
    .tile:hover { transform: translateY(-3px); box-shadow: var(--shadow); }
    .tile img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .tile-card { display: flex; flex-direction: column; aspect-ratio: auto; place-items: stretch; background: var(--card); }
    .tile-card .tile-media { position: relative; display: grid; place-items: center; aspect-ratio: 4/3; background: var(--surface); overflow: hidden; }
    .tile-card .tile-media img { position: static; width: 100%; height: 100%; object-fit: cover; }
    .tile-label {
      position: absolute; inset: auto 0 0; padding: 28px 14px 12px;
      background: linear-gradient(transparent, rgba(0, 0, 0, .68));
      color: #fff; font: 600 1rem var(--font-heading);
    }
    .tile-label small { display: block; font: 400 .78rem var(--font-body); opacity: .9; }
    .tile-card .tile-label {
      position: static; inset: auto; padding: 12px 14px 14px;
      background: transparent; color: var(--text); display: flex; flex-direction: column; gap: 2px;
    }
    .tile-card .tile-label small { color: var(--text-muted); opacity: 1; }

    /* shop controls + mobile disclosure */
    .shop-controls { padding: 14px 16px; margin-bottom: 20px; display: flex; flex-direction: column; gap: 12px; }
    .shop-controls-grid { display: grid; grid-template-columns: 1.15fr 2fr; gap: 12px; align-items: end; }
    .shop-search-row { display: flex; gap: 10px; align-items: flex-end; min-width: 0; }
    .shop-search-field { flex: 1; min-width: 0; }
    .filter-toggle { display: none; flex-shrink: 0; padding: 0 14px; white-space: nowrap; }
    .filter-badge {
      display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 6px;
      border-radius: var(--radius-pill); background: var(--accent); color: var(--accent-contrast);
      font-size: .74rem; font-weight: 700;
    }
    .shop-filter-drawer { min-width: 0; }
    .shop-filter-fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
    .shop-filter-field { min-width: 0; }
    .shop-status-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-top: 10px; border-top: 1px solid var(--border); flex-wrap: wrap; }
    .result-count { margin: 0; font-size: .9rem; }
    .load-more-wrap { margin-top: 28px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 10px; }
    .load-more-wrap p { margin: 0; font-size: .88rem; }
    @media (max-width: 959px) { .shop-controls-grid { grid-template-columns: minmax(0, 1fr); } }
    @media (max-width: 767px) {
      .shop-controls { padding: 12px; }
      .filter-toggle { display: inline-flex; }
      .shop-filter-drawer { display: none; }
      .shop-filter-drawer.open { display: block; }
      .shop-filter-fields { grid-template-columns: minmax(0, 1fr); }
    }

    /* product detail */
    .two-col { display: grid; grid-template-columns: 1.1fr 1fr; gap: clamp(20px, 4vw, 44px); align-items: start; }
    @media (max-width: 800px) { .two-col { grid-template-columns: 1fr; } }
    .product-gallery-col { min-width: 0; }
    .gallery {
      position: relative; aspect-ratio: 1; border-radius: var(--radius-card); overflow: hidden;
      background: var(--surface); border: 1px solid var(--border); display: grid; place-items: center;
    }
    .gallery img { width: 100%; height: 100%; object-fit: cover; }
    .gallery-empty { display: grid; place-items: center; gap: 8px; text-align: center; padding: 24px; }
    .gallery-empty-text { font-size: .86rem; }
    .gallery-count {
      position: absolute; right: 12px; bottom: 12px; padding: 4px 10px;
      border-radius: var(--radius-pill); background: color-mix(in srgb, var(--card) 88%, transparent);
      border: 1px solid var(--border); color: var(--text); font-size: .78rem; font-weight: 600; backdrop-filter: blur(6px);
    }
    .thumbs { display: flex; gap: 10px; list-style: none; padding: 0; margin: 12px 0 0; flex-wrap: wrap; }
    .thumbs button {
      padding: 0; border: 2px solid var(--border); border-radius: var(--radius-control); overflow: hidden;
      background: var(--surface); cursor: pointer; width: 64px; height: 64px; display: grid; place-items: center;
      transition: border-color .15s, transform .15s;
    }
    .thumbs button:hover { border-color: var(--text-muted); }
    .thumbs button[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 20%, transparent); }
    .thumbs img { width: 100%; height: 100%; object-fit: cover; }
    .thumb-fallback { font-size: 1.4rem; }
    .product-info-col { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
    .product-info-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
    .product-title { margin: 0; line-height: 1.12; }
    .product-sku { font-size: .8rem; color: var(--text-muted); margin: 0; }
    .product-price-wrap { padding-bottom: 6px; border-bottom: 1px solid var(--border); }
    .product-description p { margin: 0; color: var(--text-muted); line-height: 1.65; }
    .product-buy-box { padding: 18px; display: flex; flex-direction: column; gap: 14px; background: var(--card); }
    .product-qty-row { display: flex; align-items: center; gap: 12px; justify-content: space-between; }
    .product-qty-row label { margin: 0; font-weight: 600; }
    .product-qty-row select { width: auto; min-width: 96px; }
    .product-actions { display: flex; gap: 10px; flex-wrap: wrap; }
    .product-add-btn { flex: 1; min-width: 160px; }
    .related-section { margin-top: clamp(32px, 6vw, 60px); margin-bottom: 0; }
    @media (max-width: 480px) {
      .product-actions { flex-direction: column; }
      .product-actions .btn { width: 100%; }
      .thumbs button { width: 56px; height: 56px; }
    }

    /* cart + checkout + done */
    .cart-layout { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(280px, 1fr); gap: var(--gap); align-items: start; }
    .cart-items-col, .cart-summary { min-width: 0; }
    .cart-summary { position: sticky; top: 84px; }
    .cart-summary h2 { margin-bottom: 10px; }
    .cart-lines { list-style: none; margin: 0; padding: 4px 18px; }
    .cart-line { display: flex; gap: 14px; align-items: center; padding: 16px 0; border-bottom: 1px solid var(--border); }
    .cart-line:last-child { border: 0; }
    .cart-thumb {
      width: 72px; height: 72px; border-radius: var(--radius-control); overflow: hidden;
      background: var(--surface); display: grid; place-items: center; flex-shrink: 0; text-decoration: none;
    }
    .cart-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .cart-line-main { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex: 1; min-width: 0; flex-wrap: wrap; }
    .cart-line-info { display: flex; flex-direction: column; gap: 3px; min-width: 140px; flex: 1; }
    .cart-line-title { font-weight: 600; text-decoration: none; overflow-wrap: anywhere; }
    .cart-line-title:hover { color: var(--accent); }
    .cart-line-info small { display: block; }
    .cart-line-controls { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
    .qty { display: inline-flex; align-items: center; gap: 6px; padding: 2px; border: 1px solid var(--border); border-radius: var(--radius-pill); background: var(--surface); }
    .qty button {
      min-width: 44px; min-height: 44px; width: 44px; height: 44px; border-radius: 50%;
      border: 1px solid var(--border); background: var(--card); color: var(--text);

    .prose { max-width: 720px; }

    .about-card { max-width: 780px; padding: clamp(24px, 4vw, 40px); }

    .contact-layout { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--gap); align-items: start; }

    .contact-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: var(--gap); margin: 0; }
    .contact-card { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
    .contact-list dt { margin: 0; }
    .contact-list dd { margin: 0; font-size: 1rem; font-weight: 500; overflow-wrap: anywhere; }
    .contact-list a { text-decoration: none; color: var(--accent); }
    .contact-list a:hover { text-decoration: underline; }
    .contact-form h2 { margin-bottom: 14px; }
    .contact-form-note { font-size: .84rem; margin: 10px 0 0; text-align: center; }
    .contact-empty { margin: 0; }
    .not-found { max-width: 560px; margin: clamp(20px, 6vw, 48px) auto; text-align: center; }
    .not-found-card { padding: clamp(26px, 5vw, 42px); }
    .not-found-copy { max-width: 40ch; margin: 0 auto; }
    .not-found-actions { margin-top: 22px; }
    .custom-page-frame-wrap {
      border-radius: var(--radius-card);
      overflow: hidden;
      border: 1px solid var(--border);

      display: block;

      border: 0;

    @media (max-width: 860px) { .contact-layout-split { grid-template-columns: minmax(0, 1fr); } }
    @media (max-width: 480px) {

    /* footer, fab, toast */
    .site-footer {
      border-top: 1px solid var(--border); padding: clamp(28px, 5vw, 44px) 0 24px;

    .footer-brand-link { margin-right: 0; color: var(--text); }
    .footer-note { margin: 10px 0 0; max-width: 36ch; font-size: .88rem; }
    .footer-col { min-width: 0; }
    .footer-col-title { margin: 0 0 10px; text-transform: uppercase; letter-spacing: .06em; font-weight: 600; }
    .footer-links { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
    .site-footer a { text-decoration: none; }
    .footer-links a { padding: 3px 0; overflow-wrap: anywhere; }
    .site-footer a:hover { color: var(--accent); }
    .footer-bottom {
      margin-top: clamp(20px, 3vw, 28px); padding-top: 16px;
      border-top: 1px solid var(--border); display: flex;
      justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap;
    }
    .footer-copy { margin: 0; font-size: .84rem; }
    @media (max-width: 760px) {
      .footer-grid { grid-template-columns: minmax(0, 1fr); gap: 22px; }
      .footer-links { flex-direction: row; flex-wrap: wrap; gap: 4px 16px; }
      .footer-links a { min-height: 44px; display: inline-flex; align-items: center; }
    }
    .wa-fab {
      position: fixed; right: 18px; bottom: 18px; z-index: 45;
      width: 54px; height: 54px; border-radius: 50%;
      background: #1fa855; color: #fff; display: grid; place-items: center;
      font-size: 1.5rem; text-decoration: none; box-shadow: var(--shadow);
    }
    .toast {
      position: fixed; left: 50%; bottom: 24px;
      transform: translateX(-50%) translateY(20px);
      background: var(--text); color: var(--bg);
      padding: 10px 22px; border-radius: var(--radius-pill);
      font-size: .88rem; opacity: 0; pointer-events: none;
      transition: opacity .25s, transform .25s; z-index: 99;
    }
    .toast:not(:empty) { opacity: 1; transform: translateX(-50%); }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
    }
  </style>

<body>
  <div id="app"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script>
  (() => {
    'use strict';

    /* ==================== 1. STORE CONFIGURATION ==================== */
    // Enter your deployed Apps Script Web App URL (/exec) below.
    const CONFIG = {
      API_URL: 'https://script.google.com/macros/s/AKfycbzww0-Wb9bh7QmzsoBU6bg9c8o9aD5bqDdrJO6R9H8RSMafvoJHq3wd6rRyR2DHT9vSUA/exec',
      MODULES: { shop: true, newArrivals: true, categories: true, bestSellers: true, search: true },
      TRUST: [
        { title: 'Order on WhatsApp', text: 'Place your order online, then confirm with us on WhatsApp.' },
        { title: 'Email receipts', text: 'Order and payment confirmations are emailed to you.' },
        { title: 'Stock checked again', text: 'Availability is verified again when you place the order.' }
      ],
      FOOTER_NOTE: ''
    };

    /* ==================== 2. SAFE & FORMAT HELPERS ==================== */
    const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));

    function httpsUrl(value) {
      try {
        const url = new URL(String(value || '').trim());
        return url.protocol === 'https:' ? url.href : '';
      } catch {
        return '';
      }
    }

    function imageUrl(value, width = 600, extraTransform = '') {
      let url = httpsUrl(value);
      if (!url) return '';
      if (url.includes('res.cloudinary.com') && url.includes('/image/upload/')) {
        const w = Number(width) || 600;
        const t = extraTransform ? `${extraTransform},f_auto,q_auto,w_${w}` : `f_auto,q_auto,w_${w}`;
        url = url.replace('/image/upload/', `/image/upload/${t}/`);
      }
      return url;
    }

    function cloudinaryHeroUrl(hero, width) {
      const base = httpsUrl(hero && hero.image_url);
      if (!base) return '';
      if (!base.includes('res.cloudinary.com') || !base.includes('/image/upload/')) return base;
      const mode = ['fill', 'crop', 'fit', 'pad'].includes(hero.crop_mode) ? hero.crop_mode : 'fill';
      const w = Number(width) || 1200;
      const segments = [];

      // Explicit crop region goes in its own fl_relative segment before width scaling.
      const cx = Number(hero.crop_x), cy = Number(hero.crop_y), cw = Number(hero.crop_w), ch = Number(hero.crop_h);
      if (mode === 'crop' && Number.isFinite(cw) && cw > 0 && Number.isFinite(ch) && ch > 0) {
        const rx = Number.isFinite(cx) ? (cx / 100).toFixed(2) : '0.00';
        const ry = Number.isFinite(cy) ? (cy / 100).toFixed(2) : '0.00';
        const rw = (Math.min(100, Math.max(1, cw)) / 100).toFixed(2);
        const rh = (Math.min(100, Math.max(1, ch)) / 100).toFixed(2);
        segments.push(`c_crop,fl_relative,x_${rx},y_${ry},w_${rw},h_${rh}`);
      }

      const resizeParts = [];
      const grav = hero.focal_point && hero.focal_point !== 'custom' ? hero.focal_point : '';
      if (mode === 'fill') {
        resizeParts.push('c_fill');
        if (grav) resizeParts.push('g_' + grav);
      } else if (mode === 'fit') {
        resizeParts.push('c_fit');
      } else if (mode === 'pad') {
        resizeParts.push('c_pad');
      }
      resizeParts.push('f_auto', 'q_auto', 'w_' + w);
      segments.push(resizeParts.join(','));
      return base.replace('/image/upload/', `/image/upload/${segments.join('/')}/`);
    }

    function waDigits(value) {
      let digits = String(value || '').replace(/\D/g, '');
      if (digits.startsWith('00')) digits = digits.slice(2);
      if (/^0\d{10}$/.test(digits)) digits = '234' + digits.slice(1);
      return digits;
    }

    const isValidWaNumber = (digits) => {
      const d = String(digits || '');
      return d.length >= 10 && d.length <= 15;
    };

    function whatsappUrl(value) {
      const url = httpsUrl(value);
      if (!url) return '';
      try { return new URL(url).hostname === 'wa.me' ? url : ''; } catch { return ''; }
    }

    function telHref(value) {
      const cleaned = String(value || '').replace(/[^+0-9]/g, '');
      return cleaned ? 'tel:' + cleaned : '';
    }

    function slugify(text) {
      return String(text || '').normalize('NFKD').replace(/[\u0300-\u036f]/g, '')
        .toLowerCase().replace(/&/g, ' and ').replace(/['’]/g, '')
        .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
    }

    const isHexColour = (value) => /^#[0-9a-f]{6}$/i.test(String(value || ''));

    function money(value, symbol = '₦') {
      const n = Number(value);
      return (symbol || '₦') + (Number.isFinite(n) ? Math.round(n) : 0).toLocaleString('en-NG');
    }

    function percentOff(price, compareAt) {
      const p = Number(price), c = Number(compareAt);
      return c > p && p > 0 ? Math.round((1 - p / c) * 100) : 0;
    }

    /* ==================== 3. CATALOGUE, CART & CHECKOUT CORE ==================== */
    function normaliseProduct(raw) {
      const stock = Math.max(0, Number(raw && raw.stock) || 0);
      const price = Number(raw && raw.price) || 0;
      const compareAt = Number(raw && (raw.compare_at_price !== undefined ? raw.compare_at_price : raw.compareAt)) || 0;
      const images = (Array.isArray(raw && raw.images) ? raw.images : []).map((u) => httpsUrl(u)).filter(Boolean);
      const status = stock <= 0 ? 'Out of Stock' : (raw.status === 'Few Left' ? 'Few Left' : 'In Stock');
      return {
        id: String(raw.id),
        sku: String(raw.sku || ''),
        name: String(raw.name || ''),
        price,
        description: String(raw.description || ''),
        category: String(raw.category || ''),
        images,
        stock,
        status,
        createdAt: String((raw && (raw.created_at !== undefined ? raw.created_at : raw.createdAt)) || ''),
        featured: raw.featured === true || raw.featured === 'yes',
        compareAt: compareAt > price ? compareAt : 0,
        percentOff: percentOff(price, compareAt)
      };
    }

    const normaliseProducts = (list) => (Array.isArray(list) ? list : []).filter((p) => p && p.id != null).map(normaliseProduct);
    const isSoldOut = (p) => p.status === 'Out of Stock' || p.stock <= 0;
    const stockLabel = (p) => (isSoldOut(p) ? 'Out of stock' : p.status === 'Few Left' ? `Only ${p.stock} left` : 'In stock');
    const coverImage = (p, width = 600) => imageUrl(p.images[0], width);
    const hasCreatedAt = (products) => products.some((p) => p.createdAt);

    function buildCategories(products, settingsCategories = '', serverCategories = []) {
      const byName = new Map();
      if (Array.isArray(serverCategories) && serverCategories.length) {
        serverCategories.forEach((c) => {
          if (c && c.name) {
            byName.set(String(c.name).trim().toLowerCase(), {
              name: String(c.name).trim(),
              slug: String(c.slug || slugify(c.name) || 'category'),
              description: String(c.description || ''),
              imageUrl: httpsUrl(c.image_url),
              sortOrder: Number.isFinite(Number(c.sort_order)) ? Number(c.sort_order) : 100
            });
          }
        });
      }

      const names = [];
      const pushName = (n) => {
        const clean = String(n || '').trim();
        if (clean && !names.some((x) => x.toLowerCase() === clean.toLowerCase())) names.push(clean);
      };
      byName.forEach((c) => pushName(c.name));
      String(settingsCategories || '').split(',').forEach(pushName);
      products.forEach((p) => pushName(p.category));

      const used = new Set();
      return names.map((name) => {
        const meta = byName.get(name.toLowerCase());
        let slug = (meta && meta.slug) || slugify(name) || 'category';
        let n = 2;
        while (used.has(slug)) slug = `${(meta && meta.slug) || slugify(name) || 'category'}-${n++}`;
        used.add(slug);
        const inCat = products.filter((p) => p.category.toLowerCase() === name.toLowerCase());
        const cover = inCat.find((p) => p.images.length && !isSoldOut(p)) || inCat.find((p) => p.images.length);
        return {
          name,
          slug,
          description: (meta && meta.description) || '',
          count: inCat.length,
          image: (meta && meta.imageUrl) || (cover ? cover.images[0] : '')
        };
      }).filter((c) => c.count > 0);
    }

    function searchMatches(p, query) {
      const q = String(query || '').trim().toLowerCase();
      return !q || `${p.name} ${p.description} ${p.category} ${p.sku}`.toLowerCase().includes(q);
    }

    function filterProducts(products, { query = '', category = 'All', availability = 'all' } = {}) {
      return products.filter((p) => {
        if (category !== 'All' && p.category !== category) return false;
        if (!searchMatches(p, query)) return false;
        if (availability === 'in-stock') return !isSoldOut(p);
        if (availability === 'few-left') return p.status === 'Few Left';
        if (availability === 'sold-out') return isSoldOut(p);
        return true;
      });
    }

    function sortProducts(products, key = 'default') {
      const list = [...products];
      if (key === 'price-asc') list.sort((a, b) => a.price - b.price);
      else if (key === 'price-desc') list.sort((a, b) => b.price - a.price);
      else if (key === 'name') list.sort((a, b) => a.name.localeCompare(b.name));
      else if (key === 'newest') list.sort((a, b) => (b.createdAt || '').localeCompare(a.createdAt || ''));
      return list;
    }

    const newArrivals = (products, limit = 8) => sortProducts(products.filter((p) => p.createdAt), 'newest').slice(0, limit);
    const featuredProducts = (products, limit = 8) => products.filter((p) => p.featured).slice(0, limit);
    function bestSellerProducts(products, ranks, limit = 8) {
      const byId = new Map(products.map((p) => [p.id, p]));
      return (Array.isArray(ranks) ? ranks : []).slice().sort((a, b) => a.rank - b.rank)
        .map((r) => byId.get(String(r.id))).filter(Boolean).slice(0, limit);
    }
    function relatedProducts(products, product, limit = 4) {
      return products.filter((p) => p.id !== product.id && p.category === product.category).slice(0, limit);
    }

    // Cart rules
    const CART_KEY = 'cart';
    function parseStoredCart(raw) {
      try {
        const data = JSON.parse(raw || '[]');
        return Array.isArray(data) ? data.filter((l) => l && l.id != null).map((l) => ({ id: String(l.id), qty: Number(l.qty) })) : [];
      } catch { return []; }
    }
    function normaliseCart(lines, products) {
      const byId = new Map(products.map((p) => [p.id, p]));
      const totals = new Map();
      (Array.isArray(lines) ? lines : []).forEach((l) => {
        const p = l && byId.get(String(l.id));
        const qty = Number(l && l.qty);
        if (!p || isSoldOut(p) || !Number.isSafeInteger(qty) || qty < 1) return;
        totals.set(p.id, (totals.get(p.id) || 0) + qty);
      });
      const clean = [];
      totals.forEach((qty, id) => {
        const q = Math.min(qty, byId.get(id).stock);
        if (q > 0) clean.push({ id, qty: q });
      });
      return clean;
    }
    function addToCartLines(lines, products, id, amount = 1) {
      const p = products.find((x) => x.id === String(id));
      if (!p) return { lines, error: 'This product is no longer available.' };
      if (isSoldOut(p)) return { lines, error: 'This product is out of stock.' };
      const current = lines.find((l) => l.id === p.id);
      const next = (current ? current.qty : 0) + amount;
      if (next > p.stock) return { lines, error: `Only ${p.stock} of ${p.name} available.` };
      const updated = current ? lines.map((l) => (l.id === p.id ? { ...l, qty: next } : l)) : [...lines, { id: p.id, qty: amount }];
      return { lines: updated };
    }
    function setCartQuantity(lines, products, id, qty) {
      const p = products.find((x) => x.id === String(id));
      if (!p) return { lines: lines.filter((l) => l.id !== String(id)), error: 'This product is no longer available.' };
      if (qty < 1) return { lines: lines.filter((l) => l.id !== p.id) };
      if (qty > p.stock) return { lines, error: `Only ${p.stock} available.` };
      return { lines: lines.map((l) => (l.id === p.id ? { ...l, qty } : l)) };
    }
    const removeCartLine = (lines, id) => lines.filter((l) => l.id !== String(id));
    const cartCount = (lines) => lines.reduce((n, l) => n + Number(l.qty || 0), 0);
    function detailedLines(lines, products) {
      const byId = new Map(products.map((p) => [p.id, p]));
      return lines.map((l) => ({ ...l, product: byId.get(l.id) })).filter((l) => l.product)
        .map((l) => ({ ...l, lineTotal: l.product.price * l.qty }));
    }
    const cartTotal = (lines, products) => detailedLines(lines, products).reduce((n, l) => n + l.lineTotal, 0);
    function createCartStorage(storage) {
      let memory = [];
      const ok = (() => { try { storage.setItem('__t', '1'); storage.removeItem('__t'); return true; } catch { return false; } })();
      return {
        load: () => (ok ? parseStoredCart(storage.getItem(CART_KEY)) : memory),
        save: (lines) => { memory = lines; if (ok) try { storage.setItem(CART_KEY, JSON.stringify(lines)); } catch {} }
      };
    }

    // Checkout rules
    const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    const ID_KEY = 'store_checkout_request_id';
    const FP_KEY = 'store_checkout_payload';
    const LAST_KEY = 'store_last_order';

    function validateCustomer({ name = '', phone = '', email = '', address = '' }) {
      const errors = {};
      const digits = String(phone).replace(/\D/g, '');
      if (!name.trim()) errors.name = 'Enter your full name.';
      else if (name.trim().length > 120) errors.name = 'Name must be 120 characters or fewer.';
      if (!/^[+0-9()\-\s]{7,30}$/.test(phone.trim()) || digits.length < 7 || digits.length > 15) {
        errors.phone = 'Enter a valid phone number (7–15 digits).';
      }
      if (!EMAIL_RE.test(email.trim())) errors.email = 'Enter a valid email address for your receipt.';
      if (!address.trim()) errors.address = 'Enter your delivery address.';
      else if (address.trim().length > 500) errors.address = 'Address must be 500 characters or fewer.';
      return errors;
    }

    function newRequestId(cryptoImpl = globalThis.crypto) {
      return cryptoImpl && cryptoImpl.randomUUID ? cryptoImpl.randomUUID() : 'req_' + Date.now() + '_' + Math.random().toString(36).slice(2);
    }

    function checkoutFingerprint({ customer, newsletter, lines }) {
      return JSON.stringify({
        name: customer.name.trim(), phone: customer.phone.trim(), email: customer.email.trim(), address: customer.address.trim(),
        newsletter: !!newsletter, items: lines.map((l) => ({ id: l.id, qty: l.qty }))
      });
    }

    function requestIdFor(details, session = globalThis.sessionStorage) {
      const fingerprint = checkoutFingerprint(details);
      let savedId = '', savedFp = '';
      try { savedId = session.getItem(ID_KEY) || ''; savedFp = session.getItem(FP_KEY) || ''; } catch {}
      if (savedId && savedFp === fingerprint) return savedId;
      const id = newRequestId();
      try { session.setItem(ID_KEY, id); session.setItem(FP_KEY, fingerprint); } catch {}
      return id;
    }

    function clearRequestId(session = globalThis.sessionStorage) {
      try { session.removeItem(ID_KEY); session.removeItem(FP_KEY); } catch {}
    }

    function buildOrderPayload({ customer, newsletter, lines, requestId, startedAt, honeypot = '' }) {
      return {
        action: 'placeOrder',
        name: customer.name.trim(),
        phone: customer.phone.trim(),
        email: customer.email.trim(),
        address: customer.address.trim(),
        newsletter: !!newsletter,
        items: lines.map((l) => ({ id: l.id, qty: l.qty })),
        website: honeypot,
        started_at: startedAt,
        request_id: requestId
      };
    }

    class CheckoutError extends Error {
      constructor(message, { maybeSaved = false } = {}) {
        super(message);
        this.name = 'CheckoutError';
        this.maybeSaved = maybeSaved;
      }
    }

    async function submitOrder(apiUrl, payload, { fetchImpl = globalThis.fetch, timeoutMs = 30000 } = {}) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), timeoutMs);
      let result;
      try {
        const response = await fetchImpl(apiUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload),
          signal: controller.signal
        });
        result = await response.json();
        if (!response.ok || !result.ok) throw new CheckoutError(result.error || 'Your order could not be saved.');
      } catch (error) {
        if (error instanceof CheckoutError) throw error;
        throw new CheckoutError(
          error && error.name === 'AbortError'
            ? 'The request timed out. Your order may still have been saved. Press the button again to safely check the same order.'
            : 'We could not reach the store. Check your connection and press the button again. It will not create a duplicate order.',
          { maybeSaved: true }
        );
      } finally {
        clearTimeout(timer);
      }
      return { orderId: String(result.orderId), total: Number(result.total), whatsappUrl: whatsappUrl(result.whatsappUrl) };
    }

    function saveLastOrder(order, session = globalThis.sessionStorage) {
      try { session.setItem(LAST_KEY, JSON.stringify(order)); } catch {}
    }
    function loadLastOrder(session = globalThis.sessionStorage) {
      try {
        const o = JSON.parse(session.getItem(LAST_KEY) || 'null');
        return o && o.orderId ? { ...o, whatsappUrl: whatsappUrl(o.whatsappUrl) } : null;
      } catch { return null; }
    }
    function clearLastOrder(session = globalThis.sessionStorage) {
      try { session.removeItem(LAST_KEY); } catch {}
    }

    function migrateLegacyHash(hash) {
      const m = /^#(home|product|about|contact|cart|checkout|done|shop|categories|category|new-arrivals|best-sellers|page)(\/.*)?$/.exec(hash || '');
      if (!m) return null;
      return m[1] === 'home' ? '#/' : '#/' + m[1] + (m[2] || '');
    }

    /* ==================== 4. API CLIENT & OFFLINE CACHE ==================== */
    const CACHE_KEY = 'thimble_storefront_cache_v1';

    function normaliseSettings(raw = {}) {
      const s = { ...raw };
      s.store_name = String(s.store_name || 'Store');
      s.currency_symbol = String(s.currency_symbol || '₦');
      s.brand_color = isHexColour(s.brand_color) ? s.brand_color : '';
      s.whatsapp_number = waDigits(s.whatsapp_number);
      return s;
    }

    async function getJson(url, { fetchImpl = globalThis.fetch, timeoutMs = 25000 } = {}) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), timeoutMs);
      try {
        const response = await fetchImpl(url, { signal: controller.signal });
        return { response, data: await response.json() };
      } finally {
        clearTimeout(timer);
      }
    }

    async function fetchStorefront(apiUrl, opts = {}) {
      const join = (action) => apiUrl + (apiUrl.includes('?') ? '&' : '?') + 'action=' + action;
      let { response, data } = await getJson(join('storefront'), opts);
      if (data && data.ok === false && /unknown request/i.test(String(data.error))) {
        ({ response, data } = await getJson(join('products'), opts));
      }
      if (!response.ok || !data || data.ok !== true) throw new Error((data && data.error) || 'The store could not be loaded.');
      if (!Array.isArray(data.products) || !data.settings || typeof data.settings !== 'object') {
        throw new Error('The store returned incomplete catalogue data.');
      }
      return {
        products: normaliseProducts(data.products),
        settings: normaliseSettings(data.settings),
        bestSellers: Array.isArray(data.bestSellers) ? data.bestSellers : [],
        hero: (data.hero && typeof data.hero === 'object') ? data.hero : {},
        categories: Array.isArray(data.categories) ? data.categories : [],
        customPages: Array.isArray(data.customPages) ? data.customPages : [],
        navigation: Array.isArray(data.navigation) ? data.navigation : []
      };
    }

    async function fetchCustomPage(apiUrl, slug, opts = {}) {
      const url = apiUrl + (apiUrl.includes('?') ? '&' : '?') + 'action=page&slug=' + encodeURIComponent(slug);
      const { response, data } = await getJson(url, opts);
      if (!response.ok || !data || data.ok !== true || !data.page) {
        throw new Error((data && data.error) || 'Page not found.');
      }
      return data.page;
    }

    /* ==================== 5. STOREFRONT APPLICATION ==================== */
    function mountStore(options = {}) {
      const rootEl = options.root || document.getElementById('app');
      const toastEl = options.toastEl || document.getElementById('toast');
      const storage = options.storage || window.localStorage;
      const session = options.session || window.sessionStorage;
      const fetchImpl = options.fetchImpl || globalThis.fetch.bind(globalThis);
      const apiUrl = options.apiUrl !== undefined ? options.apiUrl : CONFIG.API_URL;
      const cartStore = createCartStorage(storage);

      const pageCache = new Map();

      const state = {
        status: apiUrl ? 'loading' : 'error',
        offlineMode: false,
        error: apiUrl ? '' : 'The store is not configured yet.',
        products: [],
        settings: normaliseSettings({}),
        bestSellers: [],
        hero: {},
        serverCategories: [],
        customPages: [],
        navigation: [],
        lines: cartStore.load(),
        navOpen: false,
        shopFiltersOpen: false,
        shopVisible: 12,
        galleryIndex: 0,
        galleryBroken: new Set(),
        productQty: 1,
        currentProductId: '',
        checkoutForm: { name: '', phone: '', email: '', address: '' },
        checkoutNewsletter: false,
        checkoutHoneypot: '',
        checkoutErrors: {},
        checkoutFormError: '',
        checkoutBusy: false,
        checkoutStartedAt: Date.now(),
        contactName: '',
        contactMsg: '',
        activePageSlug: '',
        activePageStatus: 'idle',
        activePageData: null,
        activePageError: ''
      };

      let toastTimer = 0;
      function notify(msg) {
        if (!toastEl) return;
        toastEl.textContent = msg || '';
        clearTimeout(toastTimer);
        if (msg) toastTimer = setTimeout(() => { toastEl.textContent = ''; }, 2600);
      }

      const fmt = (v) => money(v, state.settings.currency_symbol);

      function parseHash() {
        const raw = (options.getHash ? options.getHash() : window.location.hash) || '#/';
        const clean = raw.startsWith('#') ? raw.slice(1) : raw;
        const [pathPart, queryPart] = clean.split('?');
        const path = (pathPart || '/').replace(/\/+$/, '') || '/';
        const params = new URLSearchParams(queryPart || '');
        return { path, params, full: path + (queryPart ? '?' + queryPart : '') };
      }

      function navigate(to, { replace = false } = {}) {
        const targetHash = '#' + (to.startsWith('/') ? to : '/' + to);
        if (options.setHash) {
          options.setHash(targetHash);
        } else if (replace) {
          window.location.replace(window.location.pathname + window.location.search + targetHash);
        } else {
          window.location.hash = targetHash;
        }
        onRouteChange();
      }

      function applyBrandTheme() {
        const accent = state.settings.brand_color;
        document.documentElement.style.setProperty('--accent', isHexColour(accent) ? accent : '#0b6e4f');
        document.title = state.settings.store_name || 'Store';
      }

      function getVisibleNavLinks() {
        const defaults = [
          { nav_id: 'home', label: 'Home', target: '/', type: 'builtin', sort_order: 10 },
          { nav_id: 'shop', label: 'Shop', target: '/shop', type: 'module:shop', sort_order: 20 },
          { nav_id: 'new-arrivals', label: 'New arrivals', target: '/new-arrivals', type: 'module:newArrivals', sort_order: 30 },
          { nav_id: 'categories', label: 'Categories', target: '/categories', type: 'module:categories', sort_order: 40 },
          { nav_id: 'best-sellers', label: 'Best sellers', target: '/best-sellers', type: 'module:bestSellers', sort_order: 50 },
          { nav_id: 'about', label: 'About', target: '/about', type: 'builtin', sort_order: 60 },
          { nav_id: 'contact', label: 'Contact', target: '/contact', type: 'builtin', sort_order: 70 }
        ];
        const base = state.navigation && state.navigation.length ? state.navigation : defaults;
        const builtinVisible = base.filter((n) => {
          if (n.type && n.type.startsWith('module:')) {
            const mod = n.type.slice(7);
            return CONFIG.MODULES[mod] !== false;
          }
          return true;
        }).map((n) => ({ label: n.label, to: n.target, order: Number(n.sort_order) || 100 }));

        const customNav = (state.customPages || [])
          .filter((p) => p.show_in_nav)
          .map((p) => ({ label: p.nav_label || p.title, to: '/page/' + p.slug, order: Number(p.nav_order) || 100 }));

        return [...builtinVisible, ...customNav].sort((a, b) => a.order - b.order);
      }

      function commitCart(result, okMsg) {
        if (result.error) {
          notify(result.error);
          if (result.lines !== state.lines) {
            state.lines = result.lines;
            cartStore.save(state.lines);
            render();
          }
          return false;
        }
        state.lines = result.lines;
        cartStore.save(state.lines);
        if (okMsg) notify(okMsg);
        render();
        return true;
      }

      /* ---------- UI FRAGMENTS ---------- */
      function renderPrice(product, large) {
        return `<span class="price${large ? ' price-lg' : ''}">
          <span>${esc(fmt(product.price))}</span>
          ${product.compareAt > 0
            ? `<s class="price-was" aria-label="${esc('Was ' + fmt(product.compareAt))}">${esc(fmt(product.compareAt))}</s><span class="badge badge-sale">−${product.percentOff}%</span>`
            : ''}
        </span>`;
      }

      function renderStockBadge(product) {
        const cls = isSoldOut(product) ? 'out' : product.status === 'Few Left' ? 'few' : 'in';
        return `<span class="stock stock-${cls}">${esc(stockLabel(product))}</span>`;
      }

      function renderProductCard(p) {
        const out = isSoldOut(p);
        const img = coverImage(p, 600);
        return `<article class="card product-card">
          <a href="#/product/${encodeURIComponent(p.id)}" class="product-media" aria-label="${esc(p.name)}">
            ${img ? `<img src="${esc(img)}" alt="" loading="lazy" width="600" height="600" />` : `<span class="placeholder" aria-hidden="true">📦</span>`}
            ${out ? `<span class="badge badge-out">Sold out</span>` : ''}
          </a>
          <div class="product-body">
            <div class="product-meta">
              <span class="eyebrow">${esc(p.category)}</span>
              ${renderStockBadge(p)}
            </div>
            <h3><a href="#/product/${encodeURIComponent(p.id)}">${esc(p.name)}</a></h3>
            ${renderPrice(p, false)}
            <button type="button" class="btn btn-block" data-add-cart="${esc(p.id)}" ${out ? 'disabled' : ''}>${out ? 'Out of stock' : 'Add to cart'}</button>
          </div>
        </article>`;
      }

      function renderProductGrid(products) {
        return `<div class="grid">${products.map(renderProductCard).join('')}</div>`;
      }

      function renderPageHeader({ eyebrow, title, subtitle, breadcrumb, actionHtml }) {
        return `<header class="page-head">
          ${breadcrumb ? `<nav class="breadcrumb" aria-label="Breadcrumb">${breadcrumb}</nav>` : ''}
          <div class="page-head-row">
            <div>
              ${eyebrow ? `<p class="eyebrow">${esc(eyebrow)}</p>` : ''}
              <h1>${esc(title)}</h1>
              ${subtitle ? `<p class="muted page-lead">${esc(subtitle)}</p>` : ''}
            </div>
            ${actionHtml ? `<div class="page-head-action">${actionHtml}</div>` : ''}
          </div>
        </header>`;
      }

      function renderEmptyState(title, copy, actionHtml = '') {
        return `<div class="empty"><h2>${esc(title)}</h2>${copy ? `<p>${esc(copy)}</p>` : ''}${actionHtml}</div>`;
      }

      function renderNotFound(what = 'page') {
        return `<section class="not-found">
          <div class="card pad not-found-card">
            <p class="eyebrow">404</p>
            <h1>${what === 'page' ? 'Page not found' : `We couldn’t find that ${esc(what)}`}</h1>
            <p class="muted not-found-copy">We couldn’t find that ${esc(what)}. It may have been removed or deactivated, or the link may be out of date.</p>
            <div class="actions center not-found-actions">
              <a class="btn" href="#/">Go home</a>
              <a class="btn btn-outline" href="#/shop">Browse the shop</a>
            </div>
          </div>
        </section>`;
      }

      /* ---------- HERO SECTION (CLOUDINARY + SCREEN-SIZE FIT + FOCAL POINT) ---------- */
      function renderHero() {
        const h = state.hero || {};
        const s = state.settings || {};
        const heroImgRaw = httpsUrl(h.image_url);
        const title = h.title || s.store_name || 'Store';
        const subtitle = h.subtitle || s.tagline || s.banner_text || 'Quality products, delivered to you.';
        const eyebrow = h.eyebrow || '';
        const ctaLabel = h.cta_label !== undefined ? h.cta_label : 'Shop now';
        const ctaTo = h.cta_to || '/shop';
        const secondaryLabel = h.secondary_label || '';
        const secondaryTo = h.secondary_to || '/about';

        const heightMap = { compact: '340px', standard: '460px', tall: '580px' };
        const mobileHeightMap = { compact: '280px', standard: '380px', tall: '480px' };
        const fx = Number.isFinite(Number(h.focal_x)) ? Number(h.focal_x) : 50;
        const fy = Number.isFinite(Number(h.focal_y)) ? Number(h.focal_y) : 50;
        const overlay = Math.min(85, Math.max(0, Number(h.overlay_opacity !== '' && h.overlay_opacity != null ? h.overlay_opacity : 45))) / 100;

        const heroStyle = [
          `--hero-pos:${fx}% ${fy}%`,
          `--hero-fit-desktop:${h.fit_desktop === 'contain' ? 'contain' : 'cover'}`,
          `--hero-fit-tablet:${h.fit_tablet === 'contain' ? 'contain' : 'cover'}`,
          `--hero-fit-mobile:${h.fit_mobile === 'contain' ? 'contain' : 'cover'}`,
          `--hero-min-h-desktop:${heroImgRaw ? (heightMap[h.height_desktop] || '460px') : 'auto'}`,
          `--hero-min-h-tablet:${heroImgRaw ? (heightMap[h.height_tablet] || '420px') : 'auto'}`,
          `--hero-min-h-mobile:${heroImgRaw ? (mobileHeightMap[h.height_mobile] || '360px') : 'auto'}`,
          `--hero-overlay:${overlay.toFixed(2)}`
        ].join(';');

        let mediaHtml = '';
        if (heroImgRaw) {
          const desktopSrc = cloudinaryHeroUrl(h, 1600);
          const tabletSrc = cloudinaryHeroUrl(h, 1024);
          const mobileSrc = cloudinaryHeroUrl(h, 720);
          const zoomScale = Number(h.zoom) > 1 && Number(h.zoom) <= 2.5 ? `transform:scale(${Number(h.zoom)});transform-origin:${fx}% ${fy}%` : '';
          mediaHtml = `
            <div class="hero-media" aria-hidden="true">
              <picture>
                <source media="(max-width: 600px)" srcset="${esc(mobileSrc)}" />
                <source media="(max-width: 960px)" srcset="${esc(tabletSrc)}" />
                <img src="${esc(desktopSrc)}" alt="${esc(h.alt_text || '')}" style="${zoomScale}" onerror="this.closest('.hero').classList.remove('hero-image');this.closest('.hero-media').remove();" />
              </picture>
            </div>
            <div class="hero-scrim" aria-hidden="true"></div>
          `;
        }

        const linkTarget = (target) => {
          const external = httpsUrl(target);
          return external ? `href="${esc(external)}" target="_blank" rel="noopener noreferrer"` : `href="#${esc(target.startsWith('/') ? target : '/' + target)}"`;
        };

        return `<section class="hero${heroImgRaw ? ' hero-image' : ''}" style="${heroStyle}">
          ${mediaHtml}
          <div class="hero-content">
            ${eyebrow ? `<p class="eyebrow">${esc(eyebrow)}</p>` : ''}
            <h1>${esc(title)}</h1>
            <p class="lead">${esc(subtitle)}</p>
            <div class="actions">
              ${ctaLabel ? `<a class="btn" ${linkTarget(ctaTo)}>${esc(ctaLabel)}</a>` : ''}
              ${secondaryLabel ? `<a class="btn btn-outline" ${linkTarget(secondaryTo)}>${esc(secondaryLabel)}</a>` : ''}
            </div>
          </div>
        </section>`;
      }

      /* ---------- PAGE VIEWS ---------- */
      function viewHome() {
        const cats = buildCategories(state.products, state.settings.categories, state.serverCategories);
        const featured = featuredProducts(state.products, 4);
        const best = bestSellerProducts(state.products, state.bestSellers, 4);
        const fresh = hasCreatedAt(state.products) ? newArrivals(state.products, 4) : [];
        const showFallback = !featured.length && !fresh.length;

        return [
          renderHero(),
          `<ul class="trust">${CONFIG.TRUST.map((t) => `<li><strong>${esc(t.title)}</strong><span>${esc(t.text)}</span></li>`).join('')}</ul>`,
          CONFIG.MODULES.categories && cats.length
            ? `<section><div class="section-head"><h2>Shop by category</h2><a href="#/categories">All categories</a></div>
                <ul class="tiles">${cats.slice(0, 6).map((c) => `<li><a href="#/category/${esc(c.slug)}" class="tile">
                  ${c.image ? `<img src="${esc(imageUrl(c.image, 500))}" alt="" loading="lazy" />` : `<span class="placeholder" aria-hidden="true">📦</span>`}
                  <span class="tile-label">${esc(c.name)}<small>${c.count} ${c.count === 1 ? 'product' : 'products'}</small></span>

          CONFIG.MODULES.bestSellers && best.length ? `<section><div class="section-head"><h2>Best sellers</h2><a href="#/best-sellers">See all</a></div>${renderProductGrid(best)}</section>` : '',
          CONFIG.MODULES.newArrivals && fresh.length ? `<section><div class="section-head"><h2>New arrivals</h2><a href="#/new-arrivals">See all</a></div>${renderProductGrid(fresh)}</section>` : '',
          showFallback && state.products.length ? `<section><div class="section-head"><h2>Our products</h2><a href="#/shop">View all</a></div>${renderProductGrid(state.products.slice(0, 8))}</section>` : ''
        ].join('');

      function viewListing({ products, title, eyebrow, intro, breadcrumb, fixedCategory }, params) {
        const q = params.get('q') || '';
        const category = fixedCategory || params.get('category') || 'All';
        const avail = params.get('avail') || 'all';
        const sort = params.get('sort') || 'default';
        const cats = buildCategories(products, state.settings.categories, state.serverCategories);
        const canSortNewest = hasCreatedAt(products);
        const result = sortProducts(filterProducts(products, { query: q, category, availability: avail }), sort);
        const activeFilterCount = [!fixedCategory && category !== 'All', avail !== 'all', sort !== 'default'].filter(Boolean).length;
        const dirty = Boolean(q || activeFilterCount > 0);
        const countText = `${result.length} ${result.length === 1 ? 'product' : 'products'}`;

        let bodyHtml = '';
        if (!products.length) bodyHtml = renderEmptyState('No products yet', 'Check back soon.');
        else if (!result.length) bodyHtml = renderEmptyState('No products match', 'Try a different search or reset the filters.', dirty ? `<button type="button" class="btn btn-outline" data-reset-filters>Reset filters</button>` : '');
        else {
          bodyHtml = renderProductGrid(result.slice(0, state.shopVisible));
          if (result.length > state.shopVisible) {
            bodyHtml += `<div class="load-more-wrap">
              <p class="muted">Showing ${Math.min(state.shopVisible, result.length)} of ${result.length}</p>
              <button type="button" class="btn btn-outline" data-load-more>Load more</button>
            </div>`;
          }
        }

        return `<div class="listing-page">
          ${renderPageHeader({ eyebrow, title, subtitle: intro, breadcrumb })}
          ${products.length > 0 ? `<form class="shop-controls card" role="search" onsubmit="return false">
            <div class="shop-controls-grid">
              <div class="shop-search-row">
                <div class="shop-search-field">
                  <label for="shop-q">Search</label>
                  <input id="shop-q" type="search" value="${esc(q)}" placeholder="Name or category" />
                </div>
                <button type="button" class="btn btn-outline filter-toggle" id="filter-toggle-btn" aria-expanded="${state.shopFiltersOpen}" aria-controls="shop-filter-drawer">
                  ${state.shopFiltersOpen ? 'Hide filters' : 'Filters'}
                  ${activeFilterCount > 0 ? `<span class="filter-badge" aria-hidden="true">${activeFilterCount}</span>` : ''}
                </button>
              </div>
              <div id="shop-filter-drawer" class="shop-filter-drawer${state.shopFiltersOpen ? ' open' : ''}">
                <div class="shop-filter-fields">
                  ${!fixedCategory && cats.length > 1 ? `<div class="shop-filter-field">
                    <label for="shop-cat">Category</label>
                    <select id="shop-cat">
                      <option value="All"${category === 'All' ? ' selected' : ''}>All categories</option>
                      ${cats.map((c) => `<option value="${esc(c.name)}"${c.name === category ? ' selected' : ''}>${esc(c.name)}</option>`).join('')}
                    </select>
                  </div>` : ''}
                  <div class="shop-filter-field">
                    <label for="shop-av">Availability</label>
                    <select id="shop-av">
                      <option value="all"${avail === 'all' ? ' selected' : ''}>Any</option>
                      <option value="in-stock"${avail === 'in-stock' ? ' selected' : ''}>In stock</option>
                      <option value="few-left"${avail === 'few-left' ? ' selected' : ''}>Few left</option>
                      <option value="sold-out"${avail === 'sold-out' ? ' selected' : ''}>Sold out</option>
                    </select>
                  </div>
                  <div class="shop-filter-field">
                    <label for="shop-sort">Sort by</label>
                    <select id="shop-sort">
                      <option value="default"${sort === 'default' ? ' selected' : ''}>Featured order</option>
                      ${canSortNewest ? `<option value="newest"${sort === 'newest' ? ' selected' : ''}>Newest</option>` : ''}
                      <option value="price-asc"${sort === 'price-asc' ? ' selected' : ''}>Price: low to high</option>
                      <option value="price-desc"${sort === 'price-desc' ? ' selected' : ''}>Price: high to low</option>
                      <option value="name"${sort === 'name' ? ' selected' : ''}>Name</option>
                    </select>
                  </div>
                </div>
              </div>
            </div>
            <div class="shop-status-bar">
              <p class="muted result-count" role="status" aria-live="polite">${esc(countText)}</p>
              ${dirty ? `<button type="button" class="btn btn-outline btn-sm" data-reset-filters>Reset filters</button>` : ''}
            </div>
          </form>` : ''}
          ${bodyHtml}
        </div>`;
