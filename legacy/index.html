<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Store</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,400&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#080c08;--surf:#0f140f;--card:#141c14;--bd:#243024;--tx:#ede8e0;--tx2:#b8c4b0;--mut:#6f816f;--acc:#d4920c;--g:#56a845;--r:#e0623a;--sh:0 6px 32px rgba(0,0,0,.4)}
body.light{--bg:#f4f2ed;--surf:#faf9f6;--card:#fff;--bd:#e2ddd2;--tx:#1c1f18;--tx2:#4a5043;--mut:#8a8f80;--sh:0 6px 28px rgba(0,0,0,.08)}
*{box-sizing:border-box;margin:0;padding:0}html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--tx);font-family:'Outfit',sans-serif;line-height:1.55;transition:background .3s}
h1,h2,h3,.pf{font-family:'Playfair Display',serif}button{font-family:inherit;cursor:pointer}a{color:inherit}.hide{display:none!important}
header{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px 14px;padding:10px 5vw;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--bd)}
.logo{display:flex;align-items:center;gap:10px;font-family:'Playfair Display',serif;font-weight:700;font-size:1.15rem;text-decoration:none}
.logo i{width:34px;height:34px;border-radius:10px;background:var(--acc);display:flex;align-items:center;justify-content:center;color:#fff;font-style:normal;overflow:hidden}.logo img{width:100%;height:100%;object-fit:cover}
nav{display:flex;gap:4px}nav a{padding:7px 16px;border-radius:50px;font-size:.88rem;color:var(--tx2);text-decoration:none;transition:.2s}nav a:hover,nav a.on{background:var(--card);color:var(--acc)}
.nr{display:flex;gap:8px}.ib{position:relative;width:40px;height:40px;border-radius:50%;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:1.05rem;text-decoration:none;display:flex;align-items:center;justify-content:center}.ib:hover{border-color:var(--acc)}
.bdg{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:var(--acc);color:#fff;font-size:.68rem;font-weight:600;line-height:18px;text-align:center;padding:0 4px}
@media(max-width:700px){nav{order:3;width:100%;overflow-x:auto}}
.bn{background:var(--acc);color:#fff;text-align:center;padding:7px 5vw;font-size:.82rem}
.hero{text-align:center;padding:76px 5vw 44px;background:radial-gradient(ellipse at 50% 0,color-mix(in srgb,var(--acc) 16%,transparent),transparent 65%)}
.ey{font-size:.72rem;letter-spacing:.3em;text-transform:uppercase;color:var(--acc);margin-bottom:12px}
.hero h1{font-size:clamp(2.2rem,7vw,4.2rem);font-weight:900;line-height:1.1}.hero p{color:var(--tx2);margin:12px auto 24px;max-width:480px;font-weight:300}
.btn{display:inline-block;padding:12px 28px;border:0;border-radius:50px;background:var(--acc);color:#fff;font-size:.9rem;font-weight:600;transition:.2s;text-decoration:none;text-align:center}.btn:hover{filter:brightness(1.1)}
.btn.o{background:transparent;color:var(--tx);border:1px solid var(--bd)}.btn.w{background:#25d366}.btn:disabled{opacity:.5;cursor:not-allowed}
.pg{max-width:1100px;margin:0 auto;padding:36px 5vw 60px}.pg>h1{font-size:2rem;margin-bottom:6px}.sub{color:var(--tx2);margin-bottom:22px}
.bar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:22px}
.sr{background:var(--card);border:1px solid var(--bd);border-radius:50px;padding:9px 16px;color:var(--tx);font:inherit;font-size:.88rem;outline:0;width:230px;max-width:100%}.sr:focus{border-color:var(--acc)}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{padding:6px 16px;border-radius:50px;border:1px solid var(--bd);background:var(--card);color:var(--tx2);font-size:.8rem}.chip.on,.chip:hover{background:var(--acc);border-color:var(--acc);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:22px}
.pc{background:var(--card);border:1px solid var(--bd);border-radius:20px;overflow:hidden;transition:.25s;display:flex;flex-direction:column}.pc:hover{transform:translateY(-4px);box-shadow:var(--sh);border-color:var(--acc)}
.pi{position:relative;aspect-ratio:1;background:var(--surf);display:flex;align-items:center;justify-content:center;font-size:3rem;text-decoration:none}.pi img{width:100%;height:100%;object-fit:cover}
.tag{position:absolute;top:12px;left:12px;padding:4px 12px;border-radius:50px;font-size:.7rem;font-weight:600;background:var(--acc);color:#fff}.tag.r{background:var(--r)}
.pb{padding:16px 18px 18px;display:flex;flex-direction:column;gap:5px;flex:1}.pb h3{font-size:1.05rem}.pb h3 a{text-decoration:none}.cg{font-size:.72rem;color:var(--mut);text-transform:uppercase;letter-spacing:.1em}
.pr{font-size:1.3rem;font-weight:600;color:var(--acc)}.pb .pr{margin-top:auto;padding-top:6px}.pb .btn{width:100%;margin-top:8px}
.emp{text-align:center;color:var(--mut);padding:50px 0;grid-column:1/-1}
.two{display:grid;grid-template-columns:1.1fr 1fr;gap:32px;align-items:start}@media(max-width:800px){.two{grid-template-columns:1fr}}
.gal{aspect-ratio:1;border-radius:20px;overflow:hidden;background:var(--card);margin-bottom:10px;border:1px solid var(--bd)}.gal img{width:100%;height:100%;object-fit:cover}
.th{display:flex;gap:8px}.th img{width:58px;height:58px;border-radius:8px;object-fit:cover;cursor:pointer;border:2px solid transparent}.th img.on{border-color:var(--acc)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:22px}
.ci{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--bd);align-items:center}.ci:last-child{border:0}.ci img,.ci .ph{width:64px;height:64px;border-radius:12px;object-fit:cover;background:var(--surf);flex-shrink:0}
.ci .n{flex:1}.ci .n small{display:block;color:var(--mut)}.q{display:flex;align-items:center;gap:8px}.q button{width:28px;height:28px;border-radius:50%;border:1px solid var(--bd);background:var(--card);color:var(--tx)}
.rm{background:none;border:0;color:var(--mut);font-size:.8rem;text-decoration:underline}
.tot{display:flex;justify-content:space-between;font-size:1.15rem;font-weight:600;margin:14px 0}
.in{width:100%;background:var(--surf);border:1px solid var(--bd);border-radius:10px;padding:11px 14px;color:var(--tx);font:inherit;font-size:.9rem;outline:0;margin-bottom:12px}.in:focus{border-color:var(--acc)}
label.fl{display:block;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin-bottom:5px}
.ck{display:flex;gap:10px;align-items:flex-start;font-size:.84rem;color:var(--tx2);margin:4px 0 16px}.ck input{margin-top:4px;accent-color:var(--acc)}.hp{position:absolute!important;left:-10000px!important;top:auto!important;width:1px!important;height:1px!important;overflow:hidden!important}
.er{background:color-mix(in srgb,var(--r) 15%,transparent);color:var(--r);border-radius:10px;padding:10px 14px;font-size:.84rem;margin-bottom:12px}
.ok{text-align:center;max-width:480px;margin:0 auto}.ok .rg{width:70px;height:70px;border-radius:50%;border:3px solid var(--g);color:var(--g);font-size:2rem;line-height:64px;margin:0 auto 14px}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.ok .acts{justify-content:center}
.ab{max-width:720px}.ab p{color:var(--tx2);font-size:1.05rem;white-space:pre-line;margin-bottom:14px}
.cg2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-bottom:26px}.cg2 .card b{display:block;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--acc);margin-bottom:4px}
.tr{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;max-width:1100px;margin:0 auto;padding:0 5vw 50px}
.ti{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px;text-align:center;font-size:.85rem;color:var(--tx2)}.ti b{display:block;color:var(--tx);margin-bottom:2px}
footer{border-top:1px solid var(--bd);padding:26px 5vw;color:var(--mut);font-size:.84rem;text-align:center}footer a{margin:0 10px;text-decoration:none}footer a:hover{color:var(--acc)}
.wf{position:fixed;right:18px;bottom:18px;z-index:60;width:54px;height:54px;border-radius:50%;background:#25d366;color:#fff;font-size:1.6rem;display:flex;align-items:center;justify-content:center;text-decoration:none;box-shadow:var(--sh)}
#ts{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 22px;border-radius:50px;font-size:.85rem;z-index:99;opacity:0;pointer-events:none;transition:.3s}#ts.on{opacity:1}
@media(max-width:600px){.grid{grid-template-columns:1fr 1fr;gap:12px}.pb{padding:12px}.hero{padding:46px 5vw 28px}}
</style></head><body>
<header>
  <a class="logo" href="#home"><i id="lg">S</i><span id="sn">Store</span></a>
  <nav id="nv"><a href="#home" data-v="home">Home</a><a href="#about" data-v="about">About</a><a href="#contact" data-v="contact">Contact</a><a href="#cart" data-v="cart">Cart</a></nav>
  <div class="nr"><button class="ib" id="th" aria-label="Theme"></button><a class="ib" href="#cart" aria-label="Cart">🛒<span class="bdg" id="cn">0</span></a></div>
</header>
<div class="bn hide" id="bn"></div>
<main id="app"><div class="pg"><p class="sub">Loading…</p></div></main>
<footer id="ft"></footer>
<a class="wf hide" id="wf" target="_blank" rel="noopener" aria-label="Chat on WhatsApp">💬</a>
<div id="ts"></div>

<script>
// This is the Apps Script Web App URL that serves this store's live catalogue and orders.
const API='__API_URL__';
// Keep the catalogue, settings and cart separate, like the shop's shelves and customer's basket.
let P=[],ST={},cart=[],cat='All',q='',busy=false,DONE=null,ready=false,checkoutStartedAt=Date.now(),activeCheckoutKey='',activeCheckoutFingerprint='';
// Restore a saved basket without assuming browser storage is always available or valid.
try{const saved=JSON.parse(localStorage.getItem('cart')||'[]');cart=Array.isArray(saved)?saved:[]}catch(error){cart=[]}
// Restore the completed-order screen if the customer refreshes immediately after checkout.
try{DONE=JSON.parse(sessionStorage.getItem('store_last_order')||'null')}catch(error){DONE=null}
// Short DOM helper, like a label on a drawer.
const $=id=>document.getElementById(id);
// Escape text before placing it in HTML.
const esc=value=>String(value==null?'':value).replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
// Format whole-naira prices and tolerate missing or damaged values.
const money=value=>(ST.currency_symbol||'₦')+(Number.isFinite(Number(value))?Math.round(Number(value)).toLocaleString('en-NG'):'0');
// Find a product by its stable Sheet ID.
const prod=id=>P.find(item=>String(item.id)===String(id));
// Save the basket; private-mode browser storage may reject writes, so the shop still works in memory.
const save=()=>{try{localStorage.setItem('cart',JSON.stringify(cart))}catch(error){}};
// Keep only digits when creating WhatsApp links.
const wa=()=>String(ST.whatsapp_number||'').replace(/\D/g,'');
// Get the configured store name or a safe fallback.
const nm=()=>ST.store_name||'Store';
// Show a small transient message.
let toastTimer=0;function toast(message){const node=$('ts');node.textContent=message;node.classList.add('on');clearTimeout(toastTimer);toastTimer=setTimeout(()=>node.classList.remove('on'),2400)}
// Accept only HTTPS URLs from the database before using them as links or image sources.
function httpsUrl(value){try{const url=new URL(String(value||''),location.href);return url.protocol==='https:'?url.href:''}catch(error){return ''}}
// Add Cloudinary delivery optimisations only to genuine Cloudinary image URLs.
function imageUrl(value,width){let url=httpsUrl(value);if(!url)return '';if(url.includes('res.cloudinary.com')&&url.includes('/image/upload/'))url=url.replace('/image/upload/','/image/upload/f_auto,q_auto,w_'+(width||600)+'/');return url}
// Save and restore the customer's theme preference.
function setTh(light){document.body.classList.toggle('light',light);$('th').textContent=light?'☀':'☾';try{localStorage.setItem('theme',light?'light':'dark')}catch(error){}}
try{setTh(localStorage.getItem('theme')==='light')}catch(error){setTh(false)}
$('th').onclick=()=>setTh(!document.body.classList.contains('light'));

/* ===== LOAD STORE DATA ===== */
// Fetch the public product list and branding settings from Apps Script.
async function init(){
  try{
    const controller=new AbortController();const timeout=setTimeout(()=>controller.abort(),25000);
    let response;
    try{response=await fetch(API+'?action=products',{signal:controller.signal})}finally{clearTimeout(timeout)}
    const result=await response.json();if(!response.ok||!result.ok)throw new Error(result.error||'The store could not be loaded.');
    if(!Array.isArray(result.products)||!result.settings)throw new Error('The store returned incomplete catalogue data.');
    P=result.products;ST=result.settings;ready=true;
    normaliseCart();brand();route();
  }catch(error){
    ready=false;$('app').innerHTML='<div class="pg"><div class="emp">Couldn’t load the store.<br><br><button class="btn" id="retry">Try again</button></div></div>';
    $('retry').onclick=init;
  }
}
// Remove stale cart products and clamp saved quantities to current live stock.
function normaliseCart(){
  const clean=[];const seen=Object.create(null);
  cart.forEach(line=>{
    if(!line||!line.id)return;const product=prod(line.id);const quantity=Number(line.qty);
    if(!product||product.status==='Out of Stock'||Number(product.stock)<=0||!Number.isSafeInteger(quantity)||quantity<1)return;
    const id=String(product.id);seen[id]=(seen[id]||0)+quantity;
  });
  Object.keys(seen).forEach(id=>{const product=prod(id);const quantity=Math.min(seen[id],Number(product.stock));if(quantity>0)clean.push({id,qty:quantity})});
  cart=clean;save();
}
// Apply the store name, logo, banner, footer and WhatsApp contact details.
function brand(){
  const colour=String(ST.brand_color||'');if(/^#[0-9a-f]{6}$/i.test(colour))document.documentElement.style.setProperty('--acc',colour);
  document.title=nm();$('sn').textContent=nm();
  const logo=imageUrl(ST.logo_url,100);$('lg').innerHTML=logo?`<img src="${esc(logo)}" alt="${esc(nm())}">`:esc(nm().slice(0,1));
  if(ST.banner_text){$('bn').textContent=ST.banner_text;$('bn').classList.remove('hide')}else $('bn').classList.add('hide');
  const number=wa();if(number.length>=10&&number.length<=15){$('wf').href='https://wa.me/'+number;$('wf').classList.remove('hide')}else $('wf').classList.add('hide');
  const instagram=httpsUrl(ST.instagram_url);
  $('ft').innerHTML=`<div style="margin-bottom:10px"><a href="#home">Home</a><a href="#about">About</a><a href="#contact">Contact</a><a href="#cart">Cart</a>${instagram?`<a href="${esc(instagram)}" target="_blank" rel="noopener">Instagram</a>`:''}</div>&copy; ${new Date().getFullYear()} ${esc(nm())}`;
}

/* ===== HASH ROUTER ===== */
// Route the current hash to one of the storefront pages.
function route(){
  if(!ready)return;
  const parts=(location.hash.slice(1)||'home').split('/');const page=parts[0];let argument=parts.slice(1).join('/');
  try{argument=decodeURIComponent(argument)}catch(error){argument=''}
  const routes={home,product,about,contact,cart:cartV,checkout,done};
  (Object.prototype.hasOwnProperty.call(routes,page)?routes[page]:home)(argument);
  cartBadge();document.querySelectorAll('#nv a').forEach(link=>link.classList.toggle('on',link.dataset.v===page));scrollTo(0,0);
}
addEventListener('hashchange',route);
// Replace the current page's content.
const view=html=>$('app').innerHTML=html;

/* ===== HOME AND PRODUCT PAGES ===== */
// Create one product card from public catalogue data.
function card(product){
  const out=product.status==='Out of Stock'||Number(product.stock)<=0;const few=product.status==='Few Left';
  const image=imageUrl(product.images&&product.images[0]);
  return `<div class="pc"><a class="pi" href="#product/${encodeURIComponent(product.id)}">${image?`<img src="${esc(image)}" alt="${esc(product.name)}" loading="lazy">`:'📦'}${out?'<span class="tag r">Sold out</span>':few?`<span class="tag">Only ${Number(product.stock)} left</span>`:''}</a>
  <div class="pb"><span class="cg">${esc(product.category)}</span><h3><a href="#product/${encodeURIComponent(product.id)}">${esc(product.name)}</a></h3><div class="pr">${money(product.price)}</div>
  <button class="btn" data-action="add" data-id="${esc(product.id)}" ${out?'disabled':''}>${out?'Out of stock':'Add to cart'}</button></div></div>`;
}
// Render the home page, then attach search to the new input.
function home(){
  view(`<section class="hero"><div class="ey">Welcome</div><h1>${esc(nm())}</h1><p>${esc(ST.tagline||ST.banner_text||'Quality products, delivered to you.')}</p><button class="btn" data-action="shop-now">Shop now</button></section>
  <section class="pg" id="shop"><div class="bar"><input class="sr" id="sr" placeholder="Search products…" value="${esc(q)}" aria-label="Search products"><div class="chips" id="cc"></div></div><div class="grid" id="gr"></div></section>
  <div class="tr"><div class="ti"><b>Easy ordering</b>Order online, confirm on WhatsApp</div><div class="ti"><b>Email receipts</b>Order and payment confirmations</div><div class="ti"><b>Stock checks</b>Availability is checked again at checkout</div></div>`);
  $('sr').oninput=event=>{q=event.target.value.toLowerCase();grid()};chips();grid();
}
// Show product categories only when there is more than one real category.
function chips(){
  const categories=['All',...new Set(P.map(product=>product.category).filter(Boolean))];
  $('cc').innerHTML=categories.length>2?categories.map(category=>`<button class="chip${category===cat?' on':''}" data-action="category" data-category="${esc(category)}">${esc(category)}</button>`).join(''):'';
}
// Apply category and search filters to the product grid.
function grid(){
  const filtered=P.filter(product=>(cat==='All'||product.category===cat)&&(!q||(String(product.name)+' '+String(product.description)).toLowerCase().includes(q)));
  $('gr').innerHTML=filtered.length?filtered.map(card).join(''):'<div class="emp">No products found.</div>';
}
// Show one product's gallery, availability and full description.
function product(id){
  const item=prod(id);if(!item){location.hash='home';return}
  const out=item.status==='Out of Stock'||Number(item.stock)<=0;const images=Array.isArray(item.images)?item.images:[];
  const first=imageUrl(images[0],900);
  view(`<div class="pg"><a href="#home" class="sub" style="display:inline-block;text-decoration:none">← Back to shop</a><div class="two"><div>
  <div class="gal">${first?`<img id="gm" src="${esc(first)}" alt="${esc(item.name)}">`:'<div class="emp">📦</div>'}</div>
  ${images.length>1?'<div class="th">'+images.map((url,index)=>`<img src="${esc(imageUrl(url,120))}" data-action="thumbnail" data-src="${esc(imageUrl(url,900))}" class="${index?'':'on'}" alt="${esc(item.name)} image ${index+1}">`).join('')+'</div>':''}</div>
  <div><span class="cg">${esc(item.category)}</span><h1 style="font-size:2rem;margin:4px 0">${esc(item.name)}</h1><div class="pr" style="font-size:1.6rem">${money(item.price)}</div>
  <p style="margin:6px 0 14px;color:${out?'var(--r)':item.status==='Few Left'?'var(--acc)':'var(--g)'};font-size:.9rem">${out?'Out of stock':item.status==='Few Left'?'Only '+Number(item.stock)+' left':'In stock'}</p>
  <p style="color:var(--tx2);white-space:pre-line">${esc(item.description)}</p>
  <div class="acts"><button class="btn" data-action="add" data-id="${esc(item.id)}" ${out?'disabled':''}>${out?'Out of stock':'Add to cart'}</button><a class="btn o" href="#cart">View cart</a></div></div></div></div>`);
}

/* ===== ABOUT AND CONTACT ===== */
// Display the editable story text, with a useful fallback for a new client.
function about(){
  view(`<div class="pg ab"><div class="ey">About us</div><h1>${esc(ST.about_title||'About '+nm())}</h1><br><p>${esc(ST.about_text||nm()+' is a small business that cares about quality and great service. Order online, confirm on WhatsApp, and we take care of the rest.')}</p><div class="acts"><a class="btn" href="#home">Shop our products</a><a class="btn o" href="#contact">Get in touch</a></div></div>`);
}
// Display only contact methods the owner actually supplied.
function contact(){
  const card=(title,value,html)=>value?`<div class="card"><b>${title}</b>${html||esc(value)}</div>`:'';
  const number=wa(),phone=String(ST.contact_phone||'').replace(/[^+0-9()\-\s]/g,'');
  const email=String(ST.contact_email||'');const instagram=httpsUrl(ST.instagram_url);
  view(`<div class="pg"><h1>Contact us</h1><p class="sub">We'd love to hear from you.</p><div class="cg2">
  ${card('WhatsApp',number.length>=10?'available':'',`<a href="https://wa.me/${number}" target="_blank" rel="noopener">Chat with us</a>`)}
  ${card('Phone',phone,`<a href="tel:${esc(phone)}">${esc(phone)}</a>`)}
  ${card('Email',email,`<a href="mailto:${esc(email)}">${esc(email)}</a>`)}${card('Address',ST.contact_address)}${card('Opening hours',ST.opening_hours)}
  ${card('Instagram',instagram,`<a href="${esc(instagram)}" target="_blank" rel="noopener">Follow us</a>`)}</div>
  ${number.length>=10?`<div class="card" style="max-width:520px"><h3 style="margin-bottom:12px">Send us a message</h3><label class="fl" for="mn">Your name</label><input class="in" id="mn" maxlength="120"><label class="fl" for="mm">Message</label><textarea class="in" id="mm" rows="4" maxlength="1000"></textarea><button class="btn w" data-action="send-message">Send on WhatsApp</button></div>`:''}</div>`);
}
// Prepare a WhatsApp message from the contact form.
function sendMsg(){
  const name=$('mn').value.trim(),message=$('mm').value.trim();if(!message)return toast('Please type a message');
  const number=wa();if(number.length<10)return toast('WhatsApp contact is not configured.');
  window.open('https://wa.me/'+number+'?text='+encodeURIComponent('Hello '+nm()+'! '+message+(name?'\n\n— '+name:'')),'_blank','noopener');
}

/* ===== CART ===== */
// Add one unit only when the product is still purchasable and stock is available.
function add(id){
  const item=prod(id);if(!item)return toast('This product is no longer available.');
  if(item.status==='Out of Stock'||Number(item.stock)<=0)return toast('This product is out of stock.');
  const current=cart.find(line=>String(line.id)===String(id));const next=(current?Number(current.qty):0)+1;
  if(next>Number(item.stock))return toast('Only '+item.stock+' of '+item.name+' available.');
  if(current)current.qty=next;else cart.push({id:String(item.id),qty:1});save();cartBadge();toast('Added to cart ✓');
}
// Change one cart quantity and never allow it to exceed the latest known stock.
function qty(id,delta){
  const line=cart.find(item=>String(item.id)===String(id));const item=prod(id);if(!line)return;
  if(!item){rem(id);return}
  const next=Number(line.qty)+Number(delta);
  if(next<1)cart=cart.filter(item=>item!==line);
  else if(next>Number(item.stock))return toast('Only '+item.stock+' available.');
  else line.qty=next;
  save();cartV();
}
// Remove a product from the basket.
function rem(id){cart=cart.filter(line=>String(line.id)!==String(id));save();cartV()}
// Calculate the visible total; the backend independently recalculates it from Sheet prices.
const total=()=>cart.reduce((sum,line)=>{const item=prod(line.id);return sum+(item?Number(item.price)*Number(line.qty):0)},0);
// Keep the header basket count current.
function cartBadge(){$('cn').textContent=cart.reduce((sum,line)=>sum+Number(line.qty||0),0)}
// Render the shopping basket with quantity controls.
function cartV(){
  cartBadge();
  view(`<div class="pg"><h1>Your cart</h1><br>`+(cart.length?`<div class="card">${cart.map(line=>{const item=prod(line.id);if(!item)return '';const image=imageUrl(item.images&&item.images[0],120);return `<div class="ci">${image?`<img src="${esc(image)}" alt="">`:'<div class="ph"></div>'}<div class="n"><a href="#product/${encodeURIComponent(item.id)}" style="text-decoration:none">${esc(item.name)}</a><small>${money(item.price)} each</small><button class="rm" data-action="remove" data-id="${esc(item.id)}">Remove</button></div><div class="q"><button data-action="quantity" data-id="${esc(item.id)}" data-delta="-1" aria-label="Decrease quantity">−</button>${Number(line.qty)}<button data-action="quantity" data-id="${esc(item.id)}" data-delta="1" aria-label="Increase quantity">+</button></div><b style="min-width:80px;text-align:right">${money(Number(item.price)*Number(line.qty))}</b></div>`}).join('')}
  <div class="tot"><span>Total</span><span>${money(total())}</span></div><div class="acts" style="justify-content:flex-end"><a class="btn o" href="#home">Keep shopping</a><a class="btn" href="#checkout">Checkout</a></div></div>`:`<div class="emp">Your cart is empty.<br><br><a class="btn" href="#home">Browse products</a></div>`)+`</div>`);
}

/* ===== CHECKOUT ===== */
// Generate a stable retry key so a lost network response cannot create a duplicate order.
function checkoutRequestId(payload){
  const fingerprint=JSON.stringify(payload);
  let savedId='',savedFingerprint='';
  try{savedId=sessionStorage.getItem('store_checkout_request_id')||'';savedFingerprint=sessionStorage.getItem('store_checkout_payload')||''}catch(error){}
  if(activeCheckoutKey&&activeCheckoutFingerprint===fingerprint)return activeCheckoutKey;
  if(savedId&&savedFingerprint===fingerprint){activeCheckoutKey=savedId;activeCheckoutFingerprint=fingerprint;return activeCheckoutKey}
  activeCheckoutKey=(window.crypto&&window.crypto.randomUUID)?window.crypto.randomUUID():'req_'+Date.now()+'_'+Math.random().toString(36).slice(2);
  activeCheckoutFingerprint=fingerprint;
  try{sessionStorage.setItem('store_checkout_request_id',activeCheckoutKey);sessionStorage.setItem('store_checkout_payload',fingerprint)}catch(error){}
  return activeCheckoutKey;
}
// Render the contact form and a server-validated order summary.
function checkout(){
  if(!cart.length){location.hash='cart';return}checkoutStartedAt=Date.now();
  view(`<div class="pg"><h1>Checkout</h1><br><div class="two"><div class="card"><div id="er" aria-live="polite"></div>
  <label class="fl" for="fn">Full name</label><input class="in" id="fn" maxlength="120" autocomplete="name" required>
  <label class="fl" for="fp">Phone (WhatsApp)</label><input class="in" id="fp" type="tel" maxlength="30" autocomplete="tel" required>
  <label class="fl" for="fe">Email (for your receipt)</label><input class="in" id="fe" type="email" maxlength="254" autocomplete="email" required>
  <label class="fl" for="fa">Delivery address</label><textarea class="in" id="fa" rows="2" maxlength="500" autocomplete="street-address" required></textarea>
  <label class="ck"><input type="checkbox" id="fnw"> Send me news and offers from ${esc(nm())} (optional)</label>
  <div class="hp" aria-hidden="true"><label for="website">Leave this field empty</label><input id="website" name="website" tabindex="-1" autocomplete="off"></div>
  <button class="btn" id="po" style="width:100%" data-action="place-order">Place order · ${money(total())}</button></div>
  <div class="card"><h3 style="margin-bottom:8px">Order summary</h3>${cart.map(line=>{const item=prod(line.id);return `<div style="display:flex;justify-content:space-between;padding:6px 0;font-size:.9rem"><span>${Number(line.qty)}× ${esc(item.name)}</span><span>${money(Number(item.price)*Number(line.qty))}</span></div>`}).join('')}
  <div class="tot"><span>Total</span><span>${money(total())}</span></div><p style="font-size:.82rem;color:var(--mut)">Availability is checked again when you place the order. Next, send your saved order on WhatsApp so the store can confirm payment and delivery.</p></div></div></div>`);
}
// Validate customer fields, save once on the server and then offer the WhatsApp handoff.
async function place(){
  if(busy)return;const value=id=>$(id).value.trim();
  const data={name:value('fn'),phone:value('fp'),email:value('fe'),address:value('fa'),newsletter:$('fnw').checked,items:cart.map(line=>({id:line.id,qty:line.qty})),website:value('website'),started_at:checkoutStartedAt};
  if(!data.name||!data.phone||!data.address||!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(data.email)){ $('er').innerHTML='<div class="er">Please fill in every field with a valid email.</div>';return }
  data.action='placeOrder';data.request_id=checkoutRequestId({name:data.name,phone:data.phone,email:data.email,address:data.address,newsletter:data.newsletter,items:data.items});
  busy=true;const button=$('po');button.disabled=true;button.textContent='Placing order…';
  // Open a temporary tab in the original click gesture; browsers can block popups after an awaited request.
  let whatsappTab=null;try{whatsappTab=window.open('about:blank','_blank')}catch(error){}
  try{
    const controller=new AbortController();const timeout=setTimeout(()=>controller.abort(),30000);
    let response;try{response=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(data),signal:controller.signal})}finally{clearTimeout(timeout)}
    const result=await response.json();if(!response.ok||!result.ok)throw new Error(result.error||'Your order could not be saved.');
    DONE=result;activeCheckoutKey='';activeCheckoutFingerprint='';try{sessionStorage.setItem('store_last_order',JSON.stringify(DONE));sessionStorage.removeItem('store_checkout_request_id');sessionStorage.removeItem('store_checkout_payload')}catch(error){}
    cart=[];save();location.hash='done';
    if(whatsappTab&&result.whatsappUrl)whatsappTab.location=result.whatsappUrl;else if(whatsappTab)whatsappTab.close();
  }catch(error){
    if(whatsappTab)try{whatsappTab.close()}catch(closeError){}
    const message=error.name==='AbortError'?'The request timed out. Your order may still have been saved. Submit again to safely check the same order.':(error.message||'Something went wrong. Please try again.');
    $('er').innerHTML='<div class="er">'+esc(message)+'</div>';button.disabled=false;button.textContent='Place order';
  }finally{busy=false}
}
// Show the saved order number and a reliable manual WhatsApp button after checkout.
function done(){
  if(!DONE){try{DONE=JSON.parse(sessionStorage.getItem('store_last_order')||'null')}catch(error){DONE=null}}
  if(!DONE)return location.hash='home';
  const link=httpsUrl(DONE.whatsappUrl);
  view(`<div class="pg"><div class="ok"><div class="rg">✓</div><h1>Order received!</h1><p class="sub" style="margin-top:8px">Order <b>${esc(DONE.orderId)}</b> · ${money(DONE.total)}</p>
  <p class="sub">Your order has been saved. ${link?'Last step: send it on WhatsApp so the store can confirm payment and delivery.':'Contact the store using its details to arrange payment and delivery.'}</p>
  <div class="acts">${link?`<a class="btn w" href="${esc(link)}" target="_blank" rel="noopener">Send on WhatsApp</a>`:''}<a class="btn o" href="#home" data-action="clear-done">Keep shopping</a></div></div></div>`);
}

/* ===== DYNAMIC CLICK HANDLERS ===== */
// Use data attributes instead of interpolating customer-controlled IDs into inline JavaScript.
$('app').addEventListener('click',event=>{
  const control=event.target.closest('[data-action]');if(!control)return;
  const action=control.dataset.action;
  if(action==='add')add(control.dataset.id);
  else if(action==='category'){cat=control.dataset.category;chips();grid()}
  else if(action==='thumbnail'){const main=$('gm');if(main){main.src=control.dataset.src;document.querySelectorAll('.th img').forEach(image=>image.classList.remove('on'));control.classList.add('on')}}
  else if(action==='remove')rem(control.dataset.id);
  else if(action==='quantity')qty(control.dataset.id,Number(control.dataset.delta));
  else if(action==='send-message')sendMsg();
  else if(action==='place-order')place();
  else if(action==='shop-now')$('shop')?.scrollIntoView({behavior:'smooth'});
  else if(action==='clear-done'){DONE=null;try{sessionStorage.removeItem('store_last_order')}catch(error){}}
});
// Load the live store once the static page is ready.
init();
</script></body></html>
